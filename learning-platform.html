<title>iGEM Learning Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..500;1,6..72,300..400&family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: glass sidebar = learning path (13 modules, unlock state, section jump links); main stage = dashboard timeline or module page (goals → content → Wissenscheck → unlock). Colour per module from a lively six-tone palette. */
:root{
  --bg:#f6f6fb;
  --ink:#1d1b2e;
  --muted:#625f7a;
  --faint:#a4a2b8;
  --glass:rgba(255,255,255,.5);
  --glass-strong:rgba(255,255,255,.84);
  --stroke:rgba(255,255,255,.9);
  --hair:rgba(29,27,46,.09);
  --highlight:rgba(255,255,255,1);
  --shadow:rgba(60,40,120,.16);
  --accent:#5b3fe0;
  --accent-soft:rgba(91,63,224,.09);
  --on-accent:#ffffff;
  --c1:#0fa898; --c2:#7255f5; --c3:#f05d50; --c4:#e8960f; --c5:#2f8cf0; --c6:#e0408c;
  --grad:linear-gradient(115deg,var(--c1),var(--c5) 35%,var(--c2) 65%,var(--c3));
  --glow-a:rgba(20,184,166,.45); --glow-b:rgba(124,92,255,.38); --glow-c:rgba(255,107,94,.36); --glow-d:rgba(245,165,36,.36);
  --good:#0c9482; --bad:#dc3f55;
  --f-serif:"Newsreader","Iowan Old Style","New York",Georgia,serif;
  --f-sans:"Geist","SF Pro Text",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0a14; --ink:#efeef7; --muted:#a6a3bd; --faint:#64627c;
  --glass:rgba(24,22,40,.52); --glass-strong:rgba(34,31,56,.86);
  --stroke:rgba(255,255,255,.09); --hair:rgba(255,255,255,.09);
  --highlight:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.55);
  --accent:#b3a4ff; --accent-soft:rgba(179,164,255,.12); --on-accent:#120c2e;
  --c1:#2fd3c0; --c2:#9b85ff; --c3:#ff7d71; --c4:#ffb43c; --c5:#5aa8ff; --c6:#ff69ac;
  --glow-a:rgba(20,184,166,.30); --glow-b:rgba(124,92,255,.34); --glow-c:rgba(255,107,94,.24); --glow-d:rgba(245,165,36,.20);
  --good:#4fd8c5; --bad:#ff8a97;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0b0a14; --ink:#efeef7; --muted:#a6a3bd; --faint:#64627c;
  --glass:rgba(24,22,40,.52); --glass-strong:rgba(34,31,56,.86);
  --stroke:rgba(255,255,255,.09); --hair:rgba(255,255,255,.09);
  --highlight:rgba(255,255,255,.08); --shadow:rgba(0,0,0,.55);
  --accent:#b3a4ff; --accent-soft:rgba(179,164,255,.12); --on-accent:#120c2e;
  --c1:#2fd3c0; --c2:#9b85ff; --c3:#ff7d71; --c4:#ffb43c; --c5:#5aa8ff; --c6:#ff69ac;
  --glow-a:rgba(20,184,166,.30); --glow-b:rgba(124,92,255,.34); --glow-c:rgba(255,107,94,.24); --glow-d:rgba(245,165,36,.20);
  --good:#4fd8c5; --bad:#ff8a97;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15.5px;line-height:1.7;font-weight:350;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3{font-family:var(--f-serif);font-weight:300;text-wrap:balance;margin:0;letter-spacing:-.005em;line-height:1.15}
h1 em,h2 em{font-style:italic;background:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.06em;animation:sheen 12s ease-in-out infinite alternate}
@keyframes sheen{to{background-position:100% 0}}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
a{color:inherit}
strong{font-weight:550}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}
.label{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);font-weight:450}
.ic{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* Ambient light */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(100px)}
.glow.a{width:55vw;height:55vw;left:-15vw;top:-20vw;background:var(--glow-a);animation:float 36s ease-in-out infinite alternate}
.glow.b{width:45vw;height:45vw;right:-12vw;top:10vh;background:var(--glow-b);animation:float 44s ease-in-out infinite alternate-reverse}
.glow.c{width:40vw;height:40vw;left:25vw;bottom:-22vw;background:var(--glow-c);animation:float 50s ease-in-out infinite alternate}
.glow.d{width:30vw;height:30vw;right:15vw;bottom:-10vw;background:var(--glow-d);animation:float 40s ease-in-out -10s infinite alternate-reverse}
@keyframes float{to{transform:translate3d(5vw,3vh,0) scale(1.08)}}

.glass{background:var(--glass);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--stroke);box-shadow:inset 0 1px 0 var(--highlight),0 30px 70px -40px var(--shadow)}

/* Shell */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:300px minmax(0,1fr);gap:28px;padding-inline:20px;padding-block:20px;max-width:1440px;margin:0 auto;min-height:100dvh}

/* Sidebar */
.sidebar{position:sticky;top:calc(20px + env(safe-area-inset-top,0px));height:calc(100dvh - 40px);border-radius:28px;display:flex;flex-direction:column;overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;border:0;background:none;padding:24px 22px 14px;text-align:left}
.brand-mark{width:32px;height:32px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.75),transparent 55%),conic-gradient(from 200deg,var(--c1),var(--c5),var(--c2),var(--c3),var(--c4),var(--c1));box-shadow:0 6px 16px -6px var(--glow-b)}
.brand b{display:block;font-family:var(--f-serif);font-weight:400;font-size:19px;line-height:1.2}
.brand small{font-size:12px;color:var(--muted)}
.side-nav{flex:1;overflow-y:auto;padding:4px 12px 14px;scrollbar-width:thin}
.home-link{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:10px 12px;border-radius:14px;text-align:left;font-size:14.5px;color:var(--muted)}
.home-link .ic{font-size:16px}
.home-link:hover{background:var(--hair);color:var(--ink)}
.home-link[aria-current="page"]{background:var(--glass-strong);color:var(--ink);box-shadow:0 6px 18px -10px var(--shadow)}
.nav-label{display:block;padding:18px 12px 8px}
.mrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:7px 10px;border-radius:14px;text-align:left}
.mrow:hover{background:var(--hair)}
.mrow[aria-current="page"]{background:color-mix(in srgb,var(--tone) 14%,var(--glass-strong));box-shadow:0 6px 18px -10px var(--shadow)}
.mname{font-family:var(--f-serif);font-size:16.5px;font-weight:400;line-height:1.25;min-width:0}
.mrow.locked .mname{color:var(--faint)}
.badge{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--tone);border:1.5px solid var(--tone);background:color-mix(in srgb,var(--tone) 10%,transparent)}
.badge .ic{font-size:14px;stroke-width:2.4}
.done .badge,.badge.done{background:var(--tone);color:#fff;border-color:var(--tone);box-shadow:0 4px 12px -4px var(--tone)}
.locked .badge,.badge.locked{color:var(--faint);border-color:var(--hair);background:var(--hair)}
.locked .badge .ic{stroke-width:1.8}
.subnav{display:grid;gap:1px;padding:4px 0 10px 50px}
.subnav button{border:0;background:none;text-align:left;padding:5px 10px;border-radius:10px;font-size:13.5px;color:var(--muted);line-height:1.4}
.subnav button:hover{color:var(--ink);background:var(--hair)}
.subnav .sub-game{display:flex;align-items:center;gap:6px;color:var(--tone);font-weight:450}
.side-prog{padding:14px 22px 4px;border-top:1px solid var(--hair)}
.sp-top{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
.track{height:4px;border-radius:9px;background:var(--hair);overflow:hidden;margin-top:9px}
.track i{display:block;height:100%;background:var(--grad);border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.side-tools{display:grid;gap:2px;padding:10px 14px 0}
.tool{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;text-align:left;font-size:13px;color:var(--muted);padding:7px 8px;border-radius:10px}
.tool:hover{background:var(--hair);color:var(--ink)}
.sw{width:28px;height:16px;border-radius:99px;background:var(--hair);position:relative;flex:none;transition:background .3s}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:var(--glass-strong);box-shadow:0 1px 3px var(--shadow);transition:transform .3s}
[aria-pressed="true"] .sw{background:var(--accent)}
[aria-pressed="true"] .sw::after{transform:translateX(12px);background:#fff}
.confirm{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px;font-size:13px;color:var(--muted)}
.confirm button{border:1px solid var(--hair);background:var(--glass-strong);border-radius:99px;padding:4px 12px;font-size:12.5px}
.confirm .danger{background:var(--bad);color:#fff;border-color:transparent}
.side-foot{display:flex;align-items:center;gap:10px;padding:10px 16px 18px 22px}
.side-foot a{flex:1;font-size:13px;color:var(--muted);text-decoration:none}
.side-foot a:hover{color:var(--ink)}
.round{width:36px;height:36px;border-radius:50%;border:0;background:var(--hair);display:grid;place-items:center;color:var(--ink);flex:none}
.round .ic{font-size:16px}
.round:hover{background:var(--accent-soft)}

/* Main */
main{min-width:0;display:flex;flex-direction:column;gap:24px}
.topbar{display:none;align-items:center;gap:12px;padding:8px 14px 8px 8px;border-radius:999px;position:sticky;top:calc(10px + env(safe-area-inset-top,0px));z-index:5}
.topbar b{font-family:var(--f-serif);font-weight:400;font-size:18px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;padding:12px 22px;font-size:14.5px;font-weight:450;border:1px solid var(--hair);background:var(--glass-strong);transition:transform .3s cubic-bezier(.2,.8,.2,1),background-position .6s,opacity .3s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.45}
.btn .ic{font-size:15px}
.btn.dark{background:var(--grad);background-size:180% 100%;color:#fff;border-color:transparent;box-shadow:0 14px 30px -12px var(--glow-b)}
.btn.dark:hover:not(:disabled){background-position:100% 0}
.btn.small{padding:9px 16px;font-size:13.5px}

/* Dashboard */
.hero{border-radius:32px;padding:clamp(32px,5.5vw,64px);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:36px;align-items:center;overflow:hidden;position:relative;isolation:isolate}
.hero::before{content:"";position:absolute;inset:-20%;z-index:-1;background:radial-gradient(38% 48% at 82% 28%,var(--glow-b),transparent 70%),radial-gradient(34% 44% at 68% 88%,var(--glow-c),transparent 70%),radial-gradient(28% 38% at 98% 78%,var(--glow-d),transparent 70%),radial-gradient(30% 40% at 10% 0%,var(--glow-a),transparent 70%);animation:mesh 20s ease-in-out infinite alternate}
@keyframes mesh{to{transform:translate3d(-4%,3%,0) rotate(4deg)}}
.hero h1{font-size:clamp(36px,4.6vw,58px);margin:16px 0 18px;max-width:15ch}
.hero .lead{color:var(--muted);font-size:16.5px;max-width:50ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.ring-wrap{position:relative;justify-self:center;width:min(230px,100%);aspect-ratio:1;max-width:100%}
.ring-wrap svg{width:100%;height:100%;display:block}
.ring-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-c b{font-family:var(--f-serif);font-weight:300;font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
.ring-c b small{font-size:.45em;color:var(--muted)}
.ring-c span{font-size:13px;color:var(--muted);margin-top:6px}
.stats{border-radius:26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden}
.stat{padding:22px 26px}
.stat+.stat{border-left:1px solid var(--hair)}
.stat b{display:block;font-family:var(--f-serif);font-weight:300;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat .track{margin-top:12px}
.finish{border-radius:26px;padding:24px 28px;display:flex;align-items:center;gap:18px;background:linear-gradient(115deg,color-mix(in srgb,var(--c1) 22%,var(--glass)),color-mix(in srgb,var(--c2) 22%,var(--glass)),color-mix(in srgb,var(--c3) 18%,var(--glass)))}
.finish h3{font-size:24px}
.finish p{color:var(--muted);font-size:14.5px}
.finish .badge{width:48px;height:48px;--tone:var(--c2)}
.finish .badge .ic{font-size:22px}
.section-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px;padding:20px 6px 0}
.section-head h2{font-size:clamp(28px,3vw,38px)}
.section-head p{color:var(--muted);max-width:44ch;font-size:14.5px}

.path{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.path-row{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px}
.node{position:relative;display:flex;justify-content:center;padding-top:26px}
.node::before{content:"";position:absolute;top:0;bottom:-12px;width:2px;background:var(--hair)}
.path-row:first-child .node::before{top:26px}
.path-row:last-child .node::before{bottom:auto;height:26px}
.path-row.done .node::before{background:color-mix(in srgb,var(--tone) 45%,transparent)}
.node .badge{width:40px;height:40px;font-size:14px;position:relative;background:var(--bg)}
.node .badge::after{content:"";position:absolute;inset:0;border-radius:50%;background:color-mix(in srgb,var(--tone) 12%,transparent)}
.done .node .badge{background:var(--tone)}
.locked .node .badge{background:var(--bg)}
.locked .node .badge::after{background:var(--hair)}
.node .badge .ic{font-size:17px;position:relative;z-index:1}
.next .node .badge{box-shadow:0 0 0 6px color-mix(in srgb,var(--tone) 18%,transparent)}
.path-card{border-radius:22px;padding:18px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;text-align:left;position:relative;overflow:hidden;transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .45s}
.path-card::after{content:"";position:absolute;right:-60px;top:-70px;width:200px;height:200px;border-radius:50%;background:var(--tone);opacity:.16;filter:blur(40px);transition:opacity .45s;pointer-events:none}
.path-card:hover{transform:translateX(4px);border-color:color-mix(in srgb,var(--tone) 40%,var(--stroke))}
.path-card:hover::after{opacity:.32}
.locked .path-card{opacity:.62}
.locked .path-card::after{opacity:0}
.pc-num{font-size:12px;color:var(--tone);font-weight:500;letter-spacing:.04em}
.locked .pc-num{color:var(--faint)}
.path-card h3{font-size:23px;font-weight:400;margin:2px 0 4px}
.path-card p{font-size:14px;color:var(--muted)}
.pc-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;position:relative;z-index:1}
.pill{font-size:12px;padding:4px 11px;border-radius:99px;white-space:nowrap;font-weight:450}
.pill.done{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.pill.open{background:color-mix(in srgb,var(--tone) 14%,transparent);color:var(--tone)}
.pill.locked{background:var(--hair);color:var(--faint)}
.pc-meta{font-size:12.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}

footer{margin-top:auto;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:24px 6px 4px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--faint)}

/* Module page */
.mod-page{display:flex;flex-direction:column;gap:22px}
.mod-head{padding:28px 8px 8px;position:relative;isolation:isolate}
.mod-head::before{content:"";position:absolute;left:-12%;top:-40%;width:75%;height:170%;z-index:-1;background:radial-gradient(closest-side,color-mix(in srgb,var(--tone) 38%,transparent),transparent);filter:blur(10px)}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.back{border:0;background:none;padding:0;color:var(--muted);font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.back:hover{color:var(--ink)}
.chap{display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-size:12.5px;font-weight:450;color:var(--tone);background:color-mix(in srgb,var(--tone) 14%,transparent);font-variant-numeric:tabular-nums}
.mod-head h1{font-size:clamp(36px,4.6vw,56px);margin:18px 0 12px;max-width:20ch}
.mod-head .intro{font-size:17.5px;color:var(--muted);max-width:56ch}
.meta{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:18px;font-size:13.5px;color:var(--muted)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta .ok{color:var(--good)}
.goals{border-radius:24px;padding:22px 28px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 28px;align-items:start}
.goals ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 10px}
.goals li{font-size:14px;padding:6px 14px;border-radius:99px;background:color-mix(in srgb,var(--tone) 11%,var(--glass-strong));border:1px solid color-mix(in srgb,var(--tone) 20%,transparent)}
.paper{border-radius:30px;padding:clamp(28px,5vw,60px) clamp(20px,5.5vw,68px)}
.prose{max-width:68ch;margin:0 auto;display:flex;flex-direction:column;gap:44px}
.sec{display:flex;flex-direction:column;gap:16px;scroll-margin-top:28px}
.sec h2{font-size:clamp(26px,2.6vw,32px);font-weight:400;display:flex;align-items:baseline;gap:14px}
.sec h2::before{content:attr(data-n);font-family:var(--f-sans);font-size:13px;font-weight:500;color:var(--tone);letter-spacing:.06em;flex:none;transform:translateY(-3px)}
.prose p,.prose li,.prose dd{font-size:16.5px;line-height:1.75}
.prose ul,.prose ol{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.prose ul>li{position:relative;padding-left:22px}
.prose ul>li::before{content:"";position:absolute;left:3px;top:.72em;width:7px;height:7px;border-radius:50%;background:var(--tone)}
.prose ol{counter-reset:o}
.prose ol>li{counter-increment:o;position:relative;padding-left:40px}
.prose ol>li::before{content:counter(o);position:absolute;left:0;top:.15em;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:500;color:var(--tone);background:color-mix(in srgb,var(--tone) 13%,transparent)}
.terms{margin:0;display:grid;border-top:1px solid var(--hair)}
.terms>div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;padding:14px 0;border-bottom:1px solid var(--hair)}
.terms dt{font-family:var(--f-serif);font-size:19px;font-weight:400;color:var(--tone);line-height:1.4}
.terms dd{margin:0}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fact{border-radius:18px;padding:16px;background:color-mix(in srgb,var(--tone) 9%,var(--glass-strong));border:1px solid var(--hair)}
.fact b{display:block;font-family:var(--f-serif);font-weight:400;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.fact span{font-size:13px;color:var(--muted);line-height:1.45;display:block;margin-top:4px}
.merke{border-radius:22px;padding:22px 26px;background:linear-gradient(120deg,color-mix(in srgb,var(--tone) 18%,transparent),color-mix(in srgb,var(--c4) 10%,transparent))}
.merke .label{color:var(--tone)}
.merke p{font-family:var(--f-serif);font-size:21px !important;line-height:1.45 !important;margin-top:6px}
.tbl{overflow-x:auto;border-radius:18px;border:1px solid var(--hair);background:var(--glass-strong)}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:520px}
.tbl th,.tbl td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--hair);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-weight:500;font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.mono{font-family:var(--f-mono);font-size:.92em;letter-spacing:.02em}
.diagram{margin:0;border-radius:20px;padding:18px;background:var(--glass-strong);border:1px solid var(--hair);overflow-x:auto}
.diagram svg{display:block;width:100%;min-width:420px;height:auto}
.diagram figcaption{font-size:13.5px;color:var(--muted);margin-top:10px}
.sv-par{fill:none;stroke:var(--faint);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.sv-new{fill:none;stroke:var(--tone);stroke-width:4;stroke-linecap:round}
.sv-tone{fill:var(--tone)}
.sv-primer{fill:var(--c4)}
.sv-enz{fill:var(--c2)}
.sv-t{fill:var(--muted);font-family:var(--f-sans);font-size:13px}
.sv-t.strong{fill:var(--ink);font-weight:500}
.sv-w{fill:#fff;font-family:var(--f-sans);font-size:11px;font-weight:600}

/* Content widgets */
.flow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;padding:22px;border-radius:20px;background:var(--glass-strong);border:1px solid var(--hair)}
.flow-n{padding:12px 22px;border-radius:16px;font-family:var(--f-serif);font-size:22px;color:#fff;box-shadow:0 10px 22px -12px var(--shadow)}
.flow-a{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);min-width:90px}
.flow-a i{display:block;width:100%;height:2px;background:var(--hair);position:relative;margin-top:4px}
.flow-a i::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--faint);border-right:0}
.pairs{display:flex;justify-content:center;gap:6px;padding:20px 12px;border-radius:20px;background:var(--glass-strong);border:1px solid var(--hair);overflow-x:auto}
.pair{display:flex;flex-direction:column;align-items:center;gap:6px}
.nt-tile{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;color:#fff}
.b-A{--b:var(--c1)} .b-T{--b:var(--c3)} .b-G{--b:var(--c2)} .b-C{--b:var(--c4)} .b-U{--b:var(--c6)}
.nt-tile{background:var(--b)}
.hb{display:flex;gap:3px;height:22px}
.hb i{width:2px;border-radius:2px;background:repeating-linear-gradient(to bottom,var(--faint) 0 3px,transparent 3px 6px)}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:12px;height:12px;border-radius:4px;background:var(--b,var(--tone))}
.strands{font-family:var(--f-mono);font-size:14.5px;line-height:1.9;padding:16px 20px;border-radius:18px;background:var(--glass-strong);border:1px solid var(--hair);overflow-x:auto;white-space:nowrap}
.strands .lbl{display:inline-block;width:170px;font-family:var(--f-sans);font-size:13px;color:var(--muted)}
.strands .hl{color:var(--tone);font-weight:500}
.genebar{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:20px;background:var(--glass-strong);border:1px solid var(--hair);overflow-x:auto}
.gb-row{display:flex;align-items:center;gap:3px;min-width:440px;font-size:12px}
.gb-row>span:first-child{width:96px;flex:none;color:var(--muted);font-size:12.5px}
.seg{height:30px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:500}
.seg.ex{background:var(--tone)}
.seg.in{background:var(--hair);color:var(--muted);font-weight:400}
.seg.cap{background:var(--c4);width:30px;border-radius:50%}
.seg.pa{background:var(--c6);padding:0 10px}
.codon-tbl{overflow-x:auto;border-radius:18px;border:1px solid var(--hair);background:var(--glass-strong)}
.codon-tbl table{border-collapse:collapse;min-width:560px;width:100%;font-size:13px}
.codon-tbl th{font-weight:500;color:var(--muted);padding:8px;font-size:12px}
.codon-tbl td{padding:6px 8px;border:1px solid var(--hair);vertical-align:top}
.codon-tbl th.fb{font-family:var(--f-serif);font-size:20px;color:var(--tone);width:44px}
.cd{display:flex;justify-content:space-between;gap:6px;font-family:var(--f-mono);line-height:1.75;padding:0 4px;border-radius:6px}
.cd b{font-weight:500;font-family:var(--f-sans)}
.cd.start{background:color-mix(in srgb,var(--good) 18%,transparent)}
.cd.stop{background:color-mix(in srgb,var(--bad) 16%,transparent)}
.sim{border-radius:22px;padding:22px;background:var(--glass-strong);border:1px solid var(--hair);display:grid;gap:18px}
.sim-ctl{display:flex;flex-wrap:wrap;gap:10px}
.toggle{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--hair);background:var(--glass);border-radius:99px;padding:8px 16px 8px 10px;font-size:14px}
.operon{overflow-x:auto;padding-top:34px}
.op-row{display:flex;align-items:flex-end;gap:4px;min-width:520px;position:relative}
.op{height:40px;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:500;position:relative}
.op.reg{background:var(--hair);color:var(--muted);width:64px;margin-right:22px}
.op.p{background:color-mix(in srgb,var(--c4) 30%,transparent);width:78px}
.op.o{background:color-mix(in srgb,var(--c3) 26%,transparent);width:70px}
.op.g{background:var(--tone);color:#fff;flex:1;font-style:italic}
.float{position:absolute;bottom:46px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;transition:all .5s cubic-bezier(.2,.8,.2,1)}
.f-rep{background:var(--c3);color:#fff}
.f-cap{background:var(--c4);color:#fff}
.f-pol{background:var(--c2);color:#fff}
.sim-out{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.sim-out>div{border-radius:16px;padding:12px 14px;background:var(--glass);border:1px solid var(--hair)}
.sim-out small{display:block;font-size:12px;color:var(--muted)}
.sim-out b{font-weight:500;font-size:15px}
.lvl{display:flex;gap:4px;margin-top:6px}
.lvl i{flex:1;height:5px;border-radius:5px;background:var(--hair)}
.lvl i.on{background:var(--tone)}
.sim-text{font-size:15px !important;color:var(--muted)}
.frame{display:grid;gap:10px}
.frame>div{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 16px;align-items:baseline;padding:12px 16px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--hair)}
.frame .lbl{font-size:13px;color:var(--muted)}
.frame code{font-family:var(--f-mono);font-size:17px;letter-spacing:.08em}
.frame mark{background:color-mix(in srgb,var(--tone) 30%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.frame small{grid-column:2;font-size:13px;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.step{border-radius:18px;padding:16px;color:#fff;position:relative;overflow:hidden}
.step b{display:block;font-family:var(--f-serif);font-weight:400;font-size:30px;line-height:1.1}
.step strong{display:block;font-size:14.5px;margin-top:2px}
.step span{display:block;font-size:13px;line-height:1.5;opacity:.92;margin-top:6px}
.step.s1{background:linear-gradient(150deg,var(--c3),var(--c6))}
.step.s2{background:linear-gradient(150deg,var(--c5),var(--c2))}
.step.s3{background:linear-gradient(150deg,var(--c4),var(--c3))}
.pcr{border-radius:22px;padding:22px;background:var(--glass-strong);border:1px solid var(--hair);display:grid;gap:14px}
.pcr-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px}
.pcr-top b{font-family:var(--f-serif);font-weight:300;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.pcr input[type=range]{width:100%;accent-color:var(--tone)}
.pcr small{color:var(--muted);font-size:13px}
.seqdemo{font-family:var(--f-mono);font-size:15px;padding:16px 20px;border-radius:18px;background:var(--glass-strong);border:1px solid var(--hair);overflow-x:auto;white-space:nowrap;line-height:2}
.proto{background:color-mix(in srgb,var(--tone) 22%,transparent);border-radius:4px;padding:2px 0}
.pamhl{background:color-mix(in srgb,var(--c4) 40%,transparent);border-radius:4px;padding:2px 0}
.scis{color:var(--bad);font-family:var(--f-sans);padding:0 2px}

/* Game */
.game{border-radius:30px;padding:clamp(24px,4.5vw,44px);scroll-margin-top:20px;position:relative;overflow:hidden;isolation:isolate}
.game::before{content:"";position:absolute;right:-120px;top:-140px;width:360px;height:360px;border-radius:50%;background:var(--tone);opacity:.14;filter:blur(60px);z-index:-1}
.game-head{max-width:64ch;display:grid;gap:8px;margin-bottom:24px}
.game-head .label{color:var(--tone)}
.game-head h2{font-size:clamp(28px,3vw,36px);font-weight:400}
.game-head p{color:var(--muted)}
.game-head .already{font-size:13.5px;color:var(--faint)}
.game-body{display:grid;gap:18px;outline:none}
.game-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.score-line{font-size:13.5px;color:var(--muted)}
.result{display:flex;flex-wrap:wrap;align-items:center;gap:16px;padding:18px 22px;border-radius:20px;border:1px solid var(--hair)}
.result.ok{background:color-mix(in srgb,var(--good) 12%,var(--glass-strong))}
.result.no{background:color-mix(in srgb,var(--bad) 9%,var(--glass-strong))}
.result>div:nth-child(2){flex:1;min-width:200px}
.result b{font-family:var(--f-serif);font-size:22px;font-weight:400}
.result p{font-size:14px;color:var(--muted)}
.result-ico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.result.ok .result-ico{background:var(--good)}
.result.no .result-ico{background:var(--bad)}
.result-ico .ic{font-size:20px;stroke-width:2.4}
.q{display:grid;gap:12px;padding-bottom:20px;border-bottom:1px solid var(--hair)}
.q-head{display:flex;gap:12px;align-items:baseline}
.q-n{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12.5px;font-weight:500;color:var(--tone);background:color-mix(in srgb,var(--tone) 13%,transparent);transform:translateY(-2px)}
.q-head p{font-family:var(--f-serif);font-size:20px;line-height:1.4}
.q-fig{max-width:340px}
.q-fig svg{width:100%;height:auto;display:block}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--hair);background:var(--glass);border-radius:16px;padding:12px 16px;font-size:14.5px;line-height:1.45;transition:border-color .25s,background .25s,opacity .25s}
.opt:hover:not(:disabled){border-color:var(--tone);background:var(--glass-strong)}
.opt .key{font-family:var(--f-serif);font-style:italic;font-size:16px;width:16px;color:var(--faint);flex:none}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,transparent)}
.opt.dim{opacity:.5}
.explain{font-size:14.5px;color:var(--muted);padding-left:38px}
.explain b{font-weight:500}
.ok{color:var(--good)} .no{color:var(--bad)}
.match{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:12px}
.match-col{display:grid;gap:8px;align-content:start}
.tile{text-align:left;border:1px solid var(--hair);background:var(--glass);border-radius:14px;padding:11px 14px;font-size:14px;line-height:1.45;transition:all .25s}
.terms-col .tile{font-family:var(--f-serif);font-size:17px}
.tile:hover:not(:disabled){border-color:var(--tone)}
.tile.sel{border-color:var(--tone);background:color-mix(in srgb,var(--tone) 14%,var(--glass-strong));box-shadow:0 0 0 3px color-mix(in srgb,var(--tone) 20%,transparent)}
.tile.matched{background:color-mix(in srgb,var(--good) 12%,transparent);border-color:color-mix(in srgb,var(--good) 40%,transparent);color:var(--muted)}
.tile.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,transparent);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.order{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.order-item{display:flex;align-items:center;gap:14px;border:1px solid var(--hair);background:var(--glass);border-radius:16px;padding:10px 10px 10px 14px}
.order-n{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:12.5px;font-weight:500;color:var(--tone);background:color-mix(in srgb,var(--tone) 13%,transparent)}
.order-t{flex:1;font-size:14.5px;line-height:1.45;min-width:0}
.order-item{position:relative;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;transition:transform .24s cubic-bezier(.2,.8,.2,1),border-color .25s,background .25s,box-shadow .25s}
.order-item:hover:not(.locked){border-color:color-mix(in srgb,var(--tone) 45%,var(--hair));background:var(--glass-strong)}
.order-item.dragging{transition:none;z-index:5;cursor:grabbing;background:var(--glass-strong);border-color:var(--tone);box-shadow:0 24px 48px -18px var(--shadow),0 0 0 3px color-mix(in srgb,var(--tone) 18%,transparent)}
.order-item.landed{border-color:var(--tone)}
.order-item.locked{cursor:default}
.dragging-list,.dragging-list *{cursor:grabbing !important}
.grip{flex:none;width:36px;height:36px;display:grid;place-items:center;color:var(--faint);border-radius:10px;touch-action:none;transition:color .2s,background .2s}
.grip .ic{font-size:20px}
.order-item:hover .grip,.order-item.dragging .grip{color:var(--tone);background:color-mix(in srgb,var(--tone) 10%,transparent)}
.order-item.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 11%,transparent)}
.order-item.wrong{border-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.order-ctl{display:flex;gap:4px;flex:none}
.mini-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--hair);background:var(--glass-strong);display:grid;place-items:center}
.mini-btn:disabled{opacity:.3}
.mini-btn .ic{font-size:16px}
.cloze{font-size:16.5px;line-height:2.4;max-width:70ch}
.gap{font:inherit;font-size:14.5px;color:var(--ink);background:var(--glass-strong);border:1px solid var(--tone);border-radius:10px;padding:3px 8px;margin:0 2px;max-width:100%}
.gap.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--glass-strong))}
.gap.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--glass-strong))}
.strand-wrap{overflow-x:auto;padding:6px 2px}
.strand{display:grid;gap:8px;width:max-content;margin:0 auto}
.strand-row{display:flex;gap:5px;align-items:center}
.end{width:26px;font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:center}
.base{width:36px;height:40px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:16px;color:#fff;background:var(--b);border:0;padding:0}
.slot{background:var(--glass-strong);border:1.5px dashed var(--faint);color:var(--ink)}
.slot.filled{background:var(--b);border:0;color:#fff}
.slot.cur{border:2px solid var(--tone);box-shadow:0 0 0 3px color-mix(in srgb,var(--tone) 22%,transparent)}
.slot.right{box-shadow:0 0 0 2px var(--good)}
.slot.wrong{box-shadow:0 0 0 2px var(--bad);animation:shake .4s}
.keypad{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.key-b{width:56px;height:52px;border-radius:14px;border:0;font-family:var(--f-mono);font-size:19px;font-weight:500;color:#fff;background:var(--b,var(--faint));box-shadow:0 8px 18px -10px var(--b,var(--shadow));transition:transform .15s}
.key-b:active{transform:scale(.94)}
.key-b.back{display:grid;place-items:center;background:var(--glass-strong);color:var(--muted);border:1px solid var(--hair);box-shadow:0 8px 18px -12px var(--shadow)}
.key-b.back:hover{color:var(--ink);border-color:var(--tone)}
.key-b.back .ic{font-size:24px;stroke-width:1.7}
.sort{display:grid;gap:10px}
.sort-item{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:14px 16px;border-radius:16px;border:1px solid var(--hair);background:var(--glass)}
.sort-item p{font-size:14.5px;line-height:1.5}
.sort-item.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.sort-item.wrong{border-color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-b{border:1px solid var(--hair);background:var(--glass-strong);border-radius:99px;padding:6px 13px;font-size:13px;transition:all .2s}
.chip-b:hover:not(:disabled){border-color:var(--tone)}
.chip-b.on{background:var(--tone);border-color:var(--tone);color:#fff}
.codons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.codon{display:grid;gap:8px;padding:14px;border-radius:16px;border:1px solid var(--hair);background:var(--glass)}
.codon .cseq{font-family:var(--f-mono);font-size:22px;font-weight:500;letter-spacing:.12em;display:flex;gap:2px}
.codon .cseq span{color:var(--b)}
.codon select{font:inherit;font-size:13.5px;color:var(--ink);background:var(--glass-strong);border:1px solid var(--hair);border-radius:10px;padding:6px 8px;width:100%}
.codon.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,transparent)}
.codon.wrong{border-color:var(--bad)}
.codon small{font-size:12px;color:var(--faint)}
details.hint{font-size:14px;color:var(--muted)}
details.hint summary{cursor:pointer;color:var(--tone);font-weight:450;width:max-content}
details.hint>*:not(summary){margin-top:10px}
.round-head{display:grid;gap:4px}
.round-head p{font-family:var(--f-serif);font-size:20px;line-height:1.4}
.seq-scroll{overflow-x:auto;padding:8px 2px}
.seq{display:flex;align-items:center;width:max-content;margin:0 auto;font-family:var(--f-mono);font-size:17px;font-weight:500}
.seq .end{width:28px}
.nt{width:19px;text-align:center;padding:8px 0;border-radius:6px}
.nt.proto{background:color-mix(in srgb,var(--tone) 22%,transparent);border-radius:0}
.nt.pam{background:color-mix(in srgb,var(--c4) 42%,transparent);border-radius:0}
.gap-b{width:10px;height:42px;border:0;background:none;padding:0;position:relative}
.gap-b::after{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;border-radius:2px;background:transparent;transition:background .2s}
.gap-b:hover::after,.gap-b:focus-visible::after{background:var(--tone)}
.gap-b.wrong::after{background:var(--bad)}
.game-body>*,.sim>*,.pcr>*,.sort>*,.mod-page>*,.prose>*,.sec>*{min-width:0}
.cutmark{width:10px;display:grid;place-items:center;color:var(--bad);position:relative;height:42px}
.cutmark::after{content:"";position:absolute;left:5px;top:2px;bottom:2px;width:2px;background:var(--bad)}
.cutmark .ic{position:absolute;top:-14px;font-size:16px;background:var(--glass-strong);border-radius:50%}
.passbar{border-radius:26px;padding:22px 26px;display:flex;flex-wrap:wrap;align-items:center;gap:18px;background:linear-gradient(115deg,color-mix(in srgb,var(--good) 16%,var(--glass)),color-mix(in srgb,var(--tone) 16%,var(--glass)));animation:pop .6s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{transform:scale(.97)}to{transform:none}}
.passbar>div:nth-child(2){flex:1;min-width:220px}
.passbar b{font-family:var(--f-serif);font-weight:400;font-size:24px}
.passbar p{font-size:14.5px;color:var(--muted)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pg{border-radius:22px;padding:18px 22px;border:1px solid var(--hair);background:var(--glass);text-align:left;display:flex;flex-direction:column;gap:2px;transition:background .3s}
.pg:hover:not(:disabled){background:var(--glass-strong)}
.pg.next{text-align:right;grid-column:2;align-items:flex-end}
.pg small{font-size:12px;color:var(--faint);display:inline-flex;align-items:center;gap:6px}
.pg b{font-family:var(--f-serif);font-weight:400;font-size:19px;line-height:1.3}
.pg:disabled{opacity:.55}
.lockpage{border-radius:30px;padding:clamp(30px,6vw,64px);display:grid;justify-items:center;text-align:center;gap:14px}
.lockpage .badge{width:64px;height:64px}

function gelSVG(lanes){
  const W=90+lanes.length*62, H=250, top=40, bot=H-22, lo=Math.log10(150), hi=Math.log10(4000);
  const y=s=>top+(hi-Math.log10(s))/(hi-lo)*(bot-top);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Agarose gel with a size marker and samples"><rect class="gel-bg" x="70" y="18" width="${W-82}" height="${H-30}" rx="12"/>`;
  s+=`<text class="gel-t s" x="58" y="34" text-anchor="end">−</text><text class="gel-t s" x="58" y="${H-14}" text-anchor="end">+</text>`;
  lanes.forEach((ln,i)=>{const x=84+i*62;
    s+=`<text class="gel-t s" x="${x+20}" y="13" text-anchor="middle">${ln.name}</text><rect class="gel-well" x="${x}" y="24" width="40" height="7" rx="2"/>`;
    ln.bands.forEach(b=>{s+=`<rect class="${ln.marker?"gel-mk":"gel-band"}" x="${x}" y="${y(b)-2.5}" width="40" height="5" rx="2.5"/>`;
      if(ln.marker)s+=`<text class="gel-t" x="62" y="${y(b)+4}" text-anchor="end">${b.toLocaleString("en-US")}</text>`});
  });
  return s+`<text class="gel-t" x="62" y="${top-12}" text-anchor="end">bp</text></svg>`;
}

const MODULES=[
{ id:"cell", title:"The Cell & Its Genome", minutes:12,
  short:"Where genetic information is stored, how it is organised and in which direction it flows.",
  goals:["Distinguish prokaryotes from eukaryotes","Explain genome, chromosome, gene and allele","Describe the central dogma"],
  sections:[
  {h:"Life is made of cells",html:`
    <p>All living things are made of cells – from bacteria, which consist of a single cell, to humans with around 30 trillion. Every cell carries a complete set of instructions: its <strong>genetic material</strong>, the DNA.</p>
    <p>Depending on where the DNA is located, we distinguish two large groups:</p>
    <ul>
      <li><strong>Prokaryotes</strong> (bacteria and archaea) have no nucleus. Their DNA lies freely in the cytoplasm, usually as a single circular chromosome. Many also carry small DNA rings called <strong>plasmids</strong>.</li>
      <li><strong>Eukaryotes</strong> (animals, plants, fungi) keep their DNA in the <strong>nucleus</strong>, spread across several linear chromosomes. Mitochondria and chloroplasts also have their own small DNA.</li>
    </ul>`},
  {h:"From genome to gene",html:`
    <dl class="terms">
      <div><dt>Genome</dt><dd>The complete genetic information of an organism.</dd></div>
      <div><dt>Chromosome</dt><dd>A single, very long DNA molecule. In eukaryotes it is wrapped around proteins called <strong>histones</strong>. DNA and proteins together are called <strong>chromatin</strong>.</dd></div>
      <div><dt>Gene</dt><dd>A stretch of DNA that carries the information for a product – usually a protein, sometimes a functional RNA.</dd></div>
      <div><dt>Allele</dt><dd>A variant of a gene, for example the variants for blood groups A, B and O.</dd></div>
    </dl>
    <div class="facts">
      <div class="fact"><b>3.1 billion</b><span>base pairs in the human genome</span></div>
      <div class="fact"><b>≈ 20,000</b><span>human genes code for proteins</span></div>
      <div class="fact"><b>1–2%</b><span>of human DNA actually codes for proteins</span></div>
      <div class="fact"><b>≈ 2 m</b><span>of DNA, stretched out, in every body cell</span></div>
    </div>`},
  {h:"The central dogma",html:`
    <p>In the cell, information flows in a fixed direction:</p>
    <div class="flow" role="img" aria-label="DNA is transcribed into RNA, RNA is translated into protein">
      <span class="flow-n" style="background:var(--c2)">DNA</span>
      <span class="flow-a">Transcription<i></i></span>
      <span class="flow-n" style="background:var(--c6)">RNA</span>
      <span class="flow-a">Translation<i></i></span>
      <span class="flow-n" style="background:var(--c1)">Protein</span>
    </div>
    <ul>
      <li><strong>Replication:</strong> Before every cell division, the DNA is copied (module 4).</li>
      <li><strong>Transcription:</strong> A gene is rewritten into RNA (module 5).</li>
      <li><strong>Translation:</strong> The RNA is translated into a protein at the ribosome (module 6).</li>
    </ul>
    <p>Retroviruses such as HIV are an exception: with the enzyme <strong>reverse transcriptase</strong> they write RNA back into DNA.</p>`}
  ],
  merke:"DNA is the archive, RNA the working copy and the protein the tool.",
  game:{type:"match",title:"Match the terms",intro:"First tap a term, then tap the matching definition.",pairs:[
    ["Genome","The complete genetic information of an organism"],

},
{ id:"dna", title:"DNA Structure", minutes:14,
  short:"Nucleotides, base pairing and the double helix – the foundation of molecular biology.",
  goals:["Name the three parts of a nucleotide","Apply complementary base pairing","Explain the 5′ and 3′ ends"],
  sections:[
  {h:"The nucleotide",html:`
    <p>DNA (deoxyribonucleic acid) is a chain of millions of building blocks called <strong>nucleotides</strong>. Each nucleotide has three parts:</p>
    <ul>
      <li>a <strong>phosphate group</strong>,</li>
      <li>the sugar <strong>deoxyribose</strong>,</li>
      <li>one of four <strong>bases</strong>: adenine (A), thymine (T), guanine (G) or cytosine (C).</li>
    </ul>
    <p>A and G are <strong>purines</strong> with two rings; C and T are <strong>pyrimidines</strong> with one ring. In every base pair a purine faces a pyrimidine – which is why the helix has the same width everywhere.</p>`},
  {h:"The double helix",html:`
    <p>In 1953, James Watson and Francis Crick described the structure of DNA. The X-ray diffraction images taken by <strong>Rosalind Franklin</strong> were crucial to their discovery.</p>
    <div data-widget="pairs"></div>
    <ul>
      <li>The <strong>backbone</strong> of sugar and phosphate is on the outside; the bases point inwards.</li>
      <li><strong>Complementary base pairing:</strong> A pairs with T via 2 hydrogen bonds, G pairs with C via 3.</li>
      <li>The helix is right-handed. One turn spans about 10.5 base pairs and is 3.4 nm high; the diameter is 2 nm.</li>
    </ul>`},
  {h:"Why direction matters",html:`
    <p>The carbon atoms of deoxyribose are numbered 1′ to 5′. This gives each strand two different ends:</p>
    <ul>
      <li>At the <strong>5′ end</strong>, a free phosphate group sits on the 5′ carbon.</li>
      <li>At the <strong>3′ end</strong>, a free OH group sits on the 3′ carbon.</li>
    </ul>
    <p>The two strands run <strong>antiparallel</strong>: one runs from 5′ to 3′, the complementary strand from 3′ to 5′. Sequences are always written in the 5′→3′ direction, and enzymes only extend DNA at its 3′ end.</p>
    <div class="strands"><span class="lbl">Strand</span>5′-A T G C G T A C-3′<br><span class="lbl">Complementary strand</span>3′-<span class="hl">T A C G C A T G</span>-5′</div>`},
  {h:"Chargaff’s rules",html:`
    <p>Because A always pairs with T and G always pairs with C, double-stranded DNA follows the rule <strong>A = T</strong> and <strong>G = C</strong>.</p>
    <p>Example: if a DNA contains 30% adenine, it also contains 30% thymine. That leaves 40% for G and C together – 20% each.</p>
    <p>GC-rich DNA is more stable because G–C pairs have three hydrogen bonds instead of two. It only separates at higher temperatures – which matters for PCR (module 10).</p>`}
  ],
  merke:"A pairs with T, G pairs with C – and the two strands always run in opposite directions.",
  game:{type:"complement",title:"Build the complementary strand",intro:"Complete the complementary strand. Tap the bases or use your keyboard (A, T, G, C).",strand:"ATGCGTTAGC"}
},
{ id:"rna", title:"RNA – The Versatile Copy", minutes:10,
  short:"How RNA differs from DNA and what its most important types do.",
  goals:["Name three differences between DNA and RNA","Distinguish mRNA, tRNA and rRNA","Place RNA in medicine and technology"],
  sections:[
  {h:"Three differences from DNA",html:`
    <div class="tbl"><table>
      <thead><tr><th></th><th>DNA</th><th>RNA</th></tr></thead>
      <tbody>
        <tr><td><strong>Sugar</strong></td><td>Deoxyribose</td><td>Ribose (extra OH group on the 2′ carbon)</td></tr>

        <tr><td><strong>Stability</strong></td><td>Very stable, long-term storage</td><td>Short-lived, broken down quickly</td></tr>
      </tbody>
    </table></div>
    <p>Precisely because RNA is short-lived, it works well as a working copy: the cell can react quickly when it no longer needs a protein.</p>`},
  {h:"The most important types of RNA",html:`
    <dl class="terms">
      <div><dt>mRNA</dt><dd><strong>Messenger RNA:</strong> the copy of a gene. It carries the instructions from the nucleus to the ribosome.</dd></div>
      <div><dt>tRNA</dt><dd><strong>Transfer RNA:</strong> a cloverleaf-shaped molecule that carries an amino acid. With its <strong>anticodon</strong> it recognises the matching codon on the mRNA.</dd></div>
      <div><dt>rRNA</dt><dd><strong>Ribosomal RNA:</strong> the main component of the ribosome. It forms the peptide bonds between amino acids – an RNA that works as an enzyme (a ribozyme).</dd></div>
      <div><dt>miRNA</dt><dd><strong>MicroRNA:</strong> short regulatory RNAs that bind to mRNAs and slow down their translation.</dd></div>
    </dl>`},
  {h:"RNA as a tool",html:`
    <ul>
      <li><strong>mRNA vaccines</strong> deliver the blueprint for a viral protein. Body cells produce it briefly, and the immune system learns to recognise it.</li>
      <li>In <strong>CRISPR/Cas9</strong>, a guide RNA leads the gene scissors to their target (module 12).</li>
      <li>The <strong>RNA world hypothesis</strong> suggests that early life was based on RNA, because RNA can both store information and speed up reactions.</li>
    </ul>`}
  ],
  merke:"RNA = ribose + uracil + mostly single-stranded. mRNA carries the information, tRNA brings the amino acids, rRNA builds the protein.",
  game:{type:"mc",title:"RNA quiz",intro:"Five questions about RNA. You’ll see an explanation right after each answer.",q:[
