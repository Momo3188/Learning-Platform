    {t:"Which RNA brings amino acids to the ribosome?",o:["mRNA","rRNA","tRNA","miRNA"],a:2,e:"tRNA carries the amino acid at one end and the anticodon at the other."},
    {t:"Which RNA strand is complementary to 5′-AUGC-3′?",o:["3′-TACG-5′","3′-UACG-5′","3′-AUGC-5′","3′-GCAU-5′"],a:1,e:"A pairs with U, G with C – and the complementary strand runs antiparallel. RNA contains no T."},
    {t:"Which statement about rRNA is correct?",o:["It carries the anticodon","It is the copy of a gene","It forms the peptide bond in the ribosome","It only occurs in viruses"],a:2,e:"rRNA forms the catalytic centre of the ribosome, which makes it a ribozyme."}]}
},
{ id:"replication", title:"DNA Replication", minutes:15,
  short:"How a cell copies its DNA quickly and almost without errors before every division.",
  goals:["Explain the semi-conservative principle","Describe the jobs of the replication enzymes","Distinguish the leading and lagging strand"],
  sections:[
  {h:"Copying semi-conservatively",html:`
    <p>During replication, each of the two strands serves as a template for a new one. Every daughter DNA therefore consists of <strong>one old and one new strand</strong> – this is called <strong>semi-conservative</strong> replication.</p>
    <p>Matthew Meselson and Franklin Stahl proved this in 1958. They first grew bacteria with heavy nitrogen (¹⁵N) and then with light nitrogen (¹⁴N). After one generation, every DNA molecule had exactly intermediate density.</p>`},
  {h:"The enzyme crew",html:`
    <dl class="terms">
      <div><dt>Helicase</dt><dd>Unwinds the double helix and separates the strands, creating the <strong>replication fork</strong>.</dd></div>
      <div><dt>Topoisomerase</dt><dd>Relieves the twisting tension ahead of the fork (in bacteria: gyrase).</dd></div>
      <div><dt>SSB proteins</dt><dd>Single-strand binding proteins keep the separated strands open.</dd></div>
      <div><dt>Primase</dt><dd>Lays down a short <strong>RNA primer</strong>. The polymerase needs a free 3′-OH as its starting point.</dd></div>
      <div><dt>DNA polymerase III</dt><dd>Extends the primer in the 5′→3′ direction and corrects its own mistakes (proofreading).</dd></div>
      <div><dt>DNA polymerase I</dt><dd>Removes the RNA primers and replaces them with DNA.</dd></div>
      <div><dt>Ligase</dt><dd>Seals the remaining gaps in the backbone.</dd></div>
    </dl>
    <p>The names polymerase I and III apply to bacteria. Eukaryotes use other polymerases that work on the same principle.</p>`},
  {h:"Leading and lagging strand",html:`
    <p>DNA polymerase can only build in the 5′→3′ direction. Because the strands are antiparallel, two different strands form at every fork:</p>
    <figure class="diagram">
      <svg viewBox="0 0 520 200" role="img" aria-label="Replication fork: the leading strand grows continuously towards the fork, the lagging strand grows away from it in short fragments">
        <path class="sv-par" d="M20 92 H190 L232 52 H505"/>
        <path class="sv-par" d="M20 108 H190 L232 148 H505"/>
        <path class="sv-new" d="M500 64 H264"/><polygon class="sv-tone" points="250,64 265,57 265,71"/>
        <rect class="sv-primer" x="486" y="60" width="14" height="8" rx="2"/>
        <path class="sv-new" d="M270 136 H318"/><polygon class="sv-tone" points="332,136 317,129 317,143"/>
        <path class="sv-new" d="M360 136 H408"/><polygon class="sv-tone" points="422,136 407,129 407,143"/>
        <path class="sv-new" d="M450 136 H490"/><polygon class="sv-tone" points="504,136 489,129 489,143"/>
        <rect class="sv-primer" x="258" y="132" width="12" height="8" rx="2"/>
        <rect class="sv-primer" x="348" y="132" width="12" height="8" rx="2"/>
        <rect class="sv-primer" x="438" y="132" width="12" height="8" rx="2"/>
        <circle class="sv-enz" cx="204" cy="100" r="14"/><text class="sv-w" x="204" y="104" text-anchor="middle">H</text>
        <text class="sv-t strong" x="262" y="92">Leading strand: continuous</text>
        <text class="sv-t strong" x="262" y="118">Lagging strand: Okazaki fragments</text>
        <text class="sv-t" x="20" y="74">← fork moves</text>
        <text class="sv-t" x="150" y="138" text-anchor="end">Helicase (H)</text>
        <rect class="sv-primer" x="20" y="178" width="14" height="8" rx="2"/><text class="sv-t" x="40" y="186">RNA primer</text>
        <path class="sv-new" d="M140 182 H166"/><text class="sv-t" x="174" y="186">new DNA</text>
        <path class="sv-par" d="M262 182 H288"/><text class="sv-t" x="296" y="186">parental strand</text>
      </svg>
      <figcaption>The leading strand grows towards the fork, the lagging strand grows away from it in short pieces.</figcaption>
    </figure>
    <ul>
      <li>The <strong>leading strand</strong> is synthesised continuously towards the fork and needs only one primer.</li>
      <li>The <strong>lagging strand</strong> is made piece by piece, away from the fork, as <strong>Okazaki fragments</strong>. In bacteria they are 1,000–2,000 nucleotides long, in eukaryotes 100–200.</li>
    </ul>`},
  {h:"Fast and precise",html:`
    <div class="facts">
      <div class="fact"><b>≈ 1,000</b><span>nucleotides per second added by E. coli at each fork</span></div>
      <div class="fact"><b>≈ 50</b><span>nucleotides per second in humans</span></div>
      <div class="fact"><b>1 : 10⁷</b><span>error rate after proofreading</span></div>
      <div class="fact"><b>1 : 10⁹</b><span>error rate after additional mismatch repair</span></div>
    </div>
    <p>Human chromosomes are huge. That is why replication starts at thousands of <strong>origins of replication</strong> at the same time – otherwise it would take weeks.</p>`}
  ],
  merke:"Helicase opens, primase starts, polymerase builds (only 5′→3′), ligase joins. The lagging strand is made in Okazaki fragments.",
  game:{type:"order",title:"Steps of replication",intro:"Put the steps in the correct order. Hold a step and drag it up or down, then check.",items:[
    "Helicase unwinds the double helix at the origin of replication.",
    "Single-strand binding proteins stabilise the separated strands.",
    "Primase lays down a short RNA primer.",
    "DNA polymerase III extends the primer in the 5′→3′ direction.",
    "DNA polymerase I replaces the RNA primers with DNA.",
    "Ligase joins the Okazaki fragments into one continuous strand."]}
},
{ id:"transcription", title:"Transcription", minutes:14,
  short:"How a gene is rewritten into RNA and, in eukaryotes, trimmed into shape afterwards.",
  goals:["Distinguish the template and coding strand","Describe the three phases of transcription","Explain the cap, poly(A) tail and splicing"],
  sections:[
  {h:"From gene to RNA",html:`
    <p>During transcription, <strong>RNA polymerase</strong> rewrites a gene into RNA. Only one of the two DNA strands serves as the template:</p>
    <ul>
      <li>The <strong>template strand</strong> (antisense strand) is read.</li>
      <li>The <strong>coding strand</strong> (sense strand) has the same sequence as the resulting mRNA – just with T instead of U.</li>
    </ul>
    <div class="strands">
      <span class="lbl">Coding strand</span>5′-ATG GCC TTA-3′<br>
      <span class="lbl">Template strand</span>3′-TAC CGG AAT-5′<br>
      <span class="lbl">mRNA</span><span class="hl">5′-AUG GCC UUA-3′</span>
    </div>`},
  {h:"Three phases",html:`
    <ol>
      <li><strong>Initiation:</strong> RNA polymerase binds to the <strong>promoter</strong> in front of the gene. In bacteria, a sigma factor helps it recognise sequences such as the Pribnow box TATAAT. In eukaryotes, the TATA box and several transcription factors are involved.</li>
      <li><strong>Elongation:</strong> The polymerase opens the DNA, reads the template strand in the 3′→5′ direction and builds RNA in the 5′→3′ direction. It does not need a primer.</li>
      <li><strong>Termination:</strong> At the <strong>terminator</strong>, the polymerase detaches. In bacteria, the new RNA often forms a hairpin loop there.</li>
    </ol>`},
  {h:"Processing in eukaryotes",html:`
    <p>In eukaryotes, a <strong>pre-mRNA</strong> is made first. Before it leaves the nucleus, it is processed in three steps:</p>
    <div class="genebar" role="img" aria-label="The pre-mRNA contains exons and introns; the mature mRNA consists of a cap, exons and a poly(A) tail">
      <div class="gb-row"><span>pre-mRNA</span><span class="seg ex" style="width:80px">Exon 1</span><span class="seg in" style="width:110px">Intron</span><span class="seg ex" style="width:70px">Exon 2</span><span class="seg in" style="width:90px">Intron</span><span class="seg ex" style="width:80px">Exon 3</span></div>
      <div class="gb-row"><span>mature mRNA</span><span class="seg cap">G</span><span class="seg ex" style="width:80px">Exon 1</span><span class="seg ex" style="width:70px">Exon 2</span><span class="seg ex" style="width:80px">Exon 3</span><span class="seg pa">AAAA…</span></div>
    </div>
    <ul>
      <li><strong>5′ cap:</strong> A modified guanosine protects the 5′ end and helps the ribosome dock.</li>
      <li><strong>Poly(A) tail:</strong> Around 200 adenine nucleotides at the 3′ end make the mRNA last longer.</li>
      <li><strong>Splicing:</strong> The spliceosome cuts out the non-coding <strong>introns</strong> and joins the <strong>exons</strong>. Through <strong>alternative splicing</strong>, one gene can produce several proteins.</li>
    </ul>
    <p>Bacteria usually have no introns. In bacteria, translation often begins while the mRNA is still being made.</p>`}
  ],
  merke:"The mRNA matches the coding strand – with U instead of T. But it is the template strand that gets read.",
  game:{type:"cloze",title:"Transcription: fill in the blanks",intro:"Choose the right word for each blank. Some words don’t fit anywhere.",
    text:"At the start of transcription, {{RNA polymerase}} binds to the {{promoter}} of a gene. It reads the {{template}} strand in the 3′→5′ direction and builds the RNA in the {{5′→3′}} direction. Instead of thymine it incorporates {{uracil}}. At the {{terminator}} it detaches again. In eukaryotes, the pre-mRNA then receives a {{5′ cap}} and a {{poly(A) tail}}. During {{splicing}}, the {{introns}} are cut out while the {{exons}} are kept.",
    extra:["DNA polymerase","thymine","coding","ribosome","3′→5′"]}
},
{ id:"translation", title:"Genetic Code & Translation", minutes:16,
  short:"How a sequence of bases becomes a chain of amino acids.",
  goals:["Read the genetic code with the codon table","Know the start and stop codons","Describe how translation works at the ribosome"],
  sections:[
  {h:"The genetic code",html:`
    <p>Three consecutive bases of the mRNA form a <strong>codon</strong>, which stands for one amino acid. With four bases there are 4 × 4 × 4 = <strong>64 codons</strong> for 20 amino acids.</p>
    <ul>
      <li><strong>Start codon:</strong> AUG – codes for methionine and marks the beginning.</li>
      <li><strong>Stop codons:</strong> UAA, UAG and UGA end translation.</li>
      <li><strong>Redundant:</strong> Most amino acids have several codons; leucine, for example, has six.</li>
      <li><strong>Unambiguous:</strong> Each codon stands for exactly one amino acid.</li>
      <li><strong>Nearly universal:</strong> Bacteria, plants and humans use almost the same code. That is why E. coli can make human insulin.</li>
      <li><strong>Read without gaps:</strong> Codons are read without pauses or overlaps in the <strong>reading frame</strong>.</li>
    </ul>`},
  {h:"The codon table",html:`
    <p>Find the first base on the left, the second at the top and the third inside the cell. <span style="color:var(--good)">Green</span> marks the start codon, <span style="color:var(--bad)">red</span> the stop codons.</p>
    <div data-widget="codons"></div>`},
  {h:"The ribosome",html:`
    <p>Ribosomes are made of rRNA and proteins and have a large and a small subunit. Bacteria have 70S ribosomes (50S + 30S), eukaryotes 80S ribosomes (60S + 40S).</p>
    <p>The ribosome has three binding sites for tRNAs:</p>
    <ul>
      <li><strong>A site</strong> (aminoacyl): the new, charged tRNA arrives here.</li>
      <li><strong>P site</strong> (peptidyl): the tRNA holding the growing chain sits here.</li>
      <li><strong>E site</strong> (exit): the empty tRNA leaves the ribosome here.</li>
    </ul>`},
  {h:"How translation works",html:`
    <ol>
      <li><strong>Initiation:</strong> The small subunit binds the mRNA – at the Shine-Dalgarno sequence in bacteria, at the 5′ cap in eukaryotes. The initiator tRNA carrying methionine pairs with AUG, then the large subunit joins.</li>
      <li><strong>Elongation:</strong> A tRNA with the matching anticodon enters the A site. The rRNA forms a peptide bond, and the ribosome moves forward by one codon.</li>
      <li><strong>Termination:</strong> When a stop codon reaches the A site, a release factor binds instead of a tRNA. The finished protein is released and the ribosome comes apart.</li>
    </ol>
    <p>The amino acid chain then folds into its three-dimensional shape – only then can the protein do its job.</p>`}
  ],
  merke:"Three bases, one codon, one amino acid. Start: AUG. Stop: UAA, UAG, UGA.",
  game:{type:"codon",title:"Crack the code",intro:"Translate the mRNA codon by codon into amino acids. You can show the codon table below.",mrna:"AUG UUC GGA AAU UGG CGC UGA"}
},
{ id:"regulation", title:"Gene Regulation", minutes:14,
  short:"Why not all genes are active at the same time – using the lac operon as an example.",
  goals:["Explain why cells regulate genes","Predict the lac operon in different situations","Place epigenetic regulation in context"],
  sections:[
  {h:"Why genes switch on and off",html:`
    <p>Almost every cell in your body contains the same DNA. Yet a nerve cell looks very different from a liver cell, because different genes are active in each.</p>
    <p>Reading genes only when needed saves energy and building materials. It also lets the cell respond to its environment – for example, to a new food source.</p>`},
  {h:"The lac operon",html:`
    <p>In 1961, François Jacob and Jacques Monod described how E. coli uses the milk sugar lactose. An <strong>operon</strong> is a group of genes that are transcribed together from one promoter.</p>
    <dl class="terms">
      <div><dt>Promoter</dt><dd>Binding site for RNA polymerase.</dd></div>
      <div><dt>Operator</dt><dd>A switch between the promoter and the genes, where the repressor binds.</dd></div>
      <div><dt>lacZ, lacY, lacA</dt><dd>Structural genes for β-galactosidase (splits lactose), permease (transports it into the cell) and transacetylase.</dd></div>
      <div><dt>lacI</dt><dd>Regulatory gene. It codes for the <strong>repressor</strong>.</dd></div>
    </dl>
    <ul>
      <li><strong>Without lactose</strong>, the repressor sits on the operator and blocks RNA polymerase. The genes stay off.</li>
      <li><strong>With lactose</strong>, allolactose is formed. It binds to the repressor and changes its shape, so the repressor lets go. The genes are transcribed.</li>
      <li><strong>Glucose</strong> is the preferred sugar. When glucose is plentiful, the signalling molecule cAMP stays low, and the helper protein CAP does not boost transcription.</li>
    </ul>`},
  {h:"Simulation: the lac operon",html:`
    <p>Switch lactose and glucose on and off and watch what happens at the operon.</p>
    <div data-widget="lac"></div>`},
  {h:"Regulation in eukaryotes",html:`
    <ul>
      <li><strong>Transcription factors</strong> bind to promoters and switch genes on or off.</li>
      <li><strong>Enhancers</strong> and <strong>silencers</strong> boost or dampen transcription – even from thousands of base pairs away.</li>
      <li><strong>Epigenetics:</strong> methyl groups on DNA usually switch genes off. Acetylated histones loosen the chromatin and make it easier to read. The sequence itself does not change.</li>
      <li><strong>After transcription:</strong> alternative splicing and miRNAs determine which proteins are actually made.</li>
    </ul>`},
  {h:"In the iGEM lab",html:`
    <p>The lac promoter is a standard tool in synthetic biology. Instead of lactose, labs use <strong>IPTG</strong>: it binds the repressor like allolactose but is not broken down by the cell. This lets you switch an inserted gene on exactly when you need it.</p>`}
  ],
  merke:"Without lactose, the repressor blocks the operator. With lactose, it lets go – and without glucose, the genes are transcribed especially strongly.",
  game:{type:"mc",title:"What happens at the operon?",intro:"Five situations – predict how the cell responds.",q:[
    {t:"An E. coli cell grows without lactose. What happens at the lac operon?",o:["The repressor sits on the operator and the genes are off","The genes are strongly transcribed","The repressor is broken down","The cell makes lactose itself"],a:0,e:"Without lactose there is no inducer (allolactose). The repressor stays on the operator and blocks RNA polymerase."},
    {t:"Lactose is present, glucose is not. How active is the operon?",o:["Switched off","Only weakly active","Strongly active","It depends on the light"],a:2,e:"The repressor has let go, and because glucose is scarce, cAMP is high. CAP–cAMP boosts transcription."},
    {t:"A mutation prevents the repressor from binding to the operator. What follows?",o:["The genes are permanently off","The genes are permanently on, even without lactose","The cell can no longer make RNA","Nothing changes"],a:1,e:"Without a working repressor, nothing blocks the operator. The genes are transcribed all the time – this is called constitutive expression."},
    {t:"Why do labs use IPTG instead of lactose to switch genes on?",o:["IPTG is cheaper than sugar","IPTG binds the repressor but is not broken down","IPTG destroys the operator","IPTG replaces RNA polymerase"],a:1,e:"IPTG acts as an inducer but is not metabolised. Its concentration stays constant – ideal for experiments."},
    {t:"What does heavy DNA methylation in a gene’s promoter usually do?",o:["The gene is transcribed more strongly","The gene is switched off","The DNA sequence changes","The gene is duplicated"],a:1,e:"Methylated promoters are recognised less well. This is a typical epigenetic switch-off mechanism that does not change the sequence."}]}
},
{ id:"mutation", title:"Mutations & DNA Repair", minutes:14,
  short:"Which errors can occur in DNA, what they cause and how the cell repairs them.",
  goals:["Distinguish silent, missense and nonsense mutations","Explain a frameshift","Name causes and repair pathways"],
  sections:[
  {h:"What is a mutation?",html:`
    <p>A <strong>mutation</strong> is a permanent change in the DNA sequence. It can have an effect, but it doesn’t have to.</p>
    <ul>
      <li><strong>Germline mutations</strong> affect egg or sperm cells and are inherited.</li>
      <li><strong>Somatic mutations</strong> arise in body cells. They are not inherited but can, for example, cause cancer.</li>
    </ul>
    <p>Besides gene mutations, there are changes to whole chromosomes and changes in chromosome number, such as trisomy 21.</p>`},
  {h:"Types of gene mutation",html:`
    <dl class="terms">
      <div><dt>Silent</dt><dd>A base changes, but the new codon codes for the same amino acid – thanks to the redundancy of the code.</dd></div>
      <div><dt>Missense</dt><dd>The new codon codes for a different amino acid. Example, sickle cell disease: GAG → GUG in β-globin, i.e. glutamic acid → valine.</dd></div>
      <div><dt>Nonsense</dt><dd>A stop codon is created. The protein ends too early and usually doesn’t work.</dd></div>
      <div><dt>Frameshift</dt><dd>If bases are inserted or deleted and their number is not a multiple of 3, the <strong>reading frame</strong> shifts.</dd></div>
    </dl>
    <p>Imagine DNA as a sentence made of three-letter words:</p>
    <div class="frame">
      <div><span class="lbl">Original</span><code>THE CAT ATE THE RAT</code></div>
      <div><span class="lbl">Substitution</span><code>THE <mark>B</mark>AT ATE THE RAT</code><small>One word changes – like a missense mutation.</small></div>
      <div><span class="lbl">Deletion of “H”</span><code>TEC ATA TET HER AT</code><small>After the deletion nothing makes sense any more – a frameshift.</small></div>
    </div>`},
  {h:"Causes",html:`
    <ul>
      <li><strong>Spontaneous errors:</strong> mistakes during replication or chemical changes to bases, for example when cytosine turns into uracil.</li>
      <li><strong>UV radiation</strong> links neighbouring thymines into <strong>thymine dimers</strong>.</li>
      <li><strong>Ionising radiation</strong> such as X-rays can cut through both strands.</li>
      <li><strong>Chemical mutagens</strong>, such as benzo[a]pyrene in cigarette smoke, alter bases.</li>
    </ul>`},
  {h:"How the cell repairs DNA",html:`
    <dl class="terms">
      <div><dt>Mismatch repair</dt><dd>Detects mispaired bases right after replication and replaces them in the new strand.</dd></div>
      <div><dt>Base excision</dt><dd>Removes single damaged bases and replaces them.</dd></div>
      <div><dt>Nucleotide excision</dt><dd>Cuts out larger damage such as thymine dimers. If it fails, the disease xeroderma pigmentosum results, with extreme sensitivity to light.</dd></div>
      <div><dt>Double-strand break</dt><dd>Is either joined quickly but error-prone (NHEJ) or repaired exactly using an intact copy (homologous recombination). CRISPR/Cas9 makes use of both (module 12).</dd></div>
    </dl>`}
  ],
  merke:"If bases are inserted or deleted and their number is not a multiple of 3, the reading frame shifts – usually with serious consequences.",
  game:{type:"sort",title:"Classify the mutations",intro:"Assign each change to the right type of mutation. The codons refer to the mRNA.",cats:["Silent","Missense","Nonsense","Frameshift"],items:[
    ["GAA (Glu) → GAG (Glu)",0],
    ["GAG (Glu) → GUG (Val)",1],
    ["UAC (Tyr) → UAA (Stop)",2],
    ["A single nucleotide is inserted in the middle of a gene",3],
    ["CUU (Leu) → CUC (Leu)",0],
    ["UGG (Trp) → UGA (Stop)",2],
    ["Two nucleotides directly after the start codon are missing",3],
    ["AAA (Lys) → AGA (Arg)",1]]}
},
{ id:"engineering", title:"Genetic Engineering: Cut & Paste", minutes:16,
  short:"Restriction enzymes, ligase and plasmids – the basic tools for recombining DNA.",
  goals:["Explain how restriction enzymes cut","Distinguish sticky and blunt ends","Name the steps of cloning"],
  sections:[
  {h:"Restriction enzymes",html:`
    <p>Bacteria defend themselves against viruses with <strong>restriction enzymes</strong>: these enzymes recognise short, specific DNA sequences and cut them. The bacterium protects its own DNA by methylating it.</p>
    <p>The recognition sequences are usually 4–8 base pairs long and <strong>palindromic</strong>: both strands read the same in the 5′→3′ direction.</p>
    <div class="strands"><span class="lbl">EcoRI cuts</span>5′-G<span class="scis">|</span>AATTC-3′<br><span class="lbl"></span>3′-CTTAA<span class="scis">|</span>G-5′</div>
    <div class="tbl"><table>
      <thead><tr><th>Enzyme</th><th>Source</th><th>Cut</th><th>Ends</th></tr></thead>
      <tbody>
        <tr><td><strong>EcoRI</strong></td><td>Escherichia coli</td><td class="mono">G^AATTC</td><td>sticky, overhang AATT</td></tr>
        <tr><td><strong>BamHI</strong></td><td>Bacillus amyloliquefaciens</td><td class="mono">G^GATCC</td><td>sticky, overhang GATC</td></tr>
        <tr><td><strong>HindIII</strong></td><td>Haemophilus influenzae</td><td class="mono">A^AGCTT</td><td>sticky, overhang AGCT</td></tr>
        <tr><td><strong>SmaI</strong></td><td>Serratia marcescens</td><td class="mono">CCC^GGG</td><td>blunt</td></tr>
      </tbody>
    </table></div>`},
  {h:"Sticky and blunt ends",html:`
    <ul>
      <li><strong>Sticky ends</strong> are created when the enzyme cuts in a staggered way. The single-stranded overhangs find matching partners like puzzle pieces.</li>
      <li><strong>Blunt ends</strong> are created by a straight cut. They can be joined to any other blunt end, but less efficiently.</li>
    </ul>
    <p><strong>DNA ligase</strong> – in the lab usually T4 ligase – then seals the sugar-phosphate backbone.</p>`},
  {h:"Plasmids as gene carriers",html:`
    <p>To get a gene into a bacterium, you insert it into a <strong>plasmid</strong>, known as a vector. A typical cloning vector contains:</p>
    <ul>
      <li>an <strong>origin of replication</strong> (ori), so that the bacterium copies the plasmid,</li>
      <li>an <strong>antibiotic resistance gene</strong> to select cells that carry the plasmid,</li>
      <li>a <strong>multiple cloning site</strong> with many cut sites for the insert,</li>
      <li>often a <strong>promoter</strong> that gets the inserted gene transcribed.</li>
    </ul>`},
  {h:"Cloning in five steps",html:`
    <ol>
      <li><strong>Cut:</strong> The gene and the plasmid are cut with the same restriction enzyme.</li>
      <li><strong>Ligate:</strong> Both are mixed, and ligase joins the matching ends.</li>
      <li><strong>Transform:</strong> The plasmid gets into E. coli by heat shock or electroporation.</li>
      <li><strong>Select:</strong> Only bacteria with the plasmid grow on agar containing antibiotic. In blue-white screening, the insert disrupts the lacZα gene, so colonies with the insert stay white.</li>
      <li><strong>Verify:</strong> Colony PCR or sequencing confirms the correct construct.</li>
    </ol>
    <p>This is how human insulin has been produced in bacteria since 1982 – before that, it was extracted from the pancreases of pigs and cattle.</p>`}
  ],
  merke:"Same enzyme, same ends: whatever was cut with the same restriction enzyme can be joined with ligase.",
  game:{type:"cut",title:"Find the cut site",intro:"Three restriction enzymes, three sequences. Tap the gap where the enzyme cuts the top strand.",rounds:[
    {seq:"ACGTTGAATTCGCAT",cut:6,task:"Cut the top strand with EcoRI.",hint:"EcoRI recognises GAATTC and cuts between G and A.",ok:"Correct: G^AATTC. This creates a sticky end with the overhang AATT."},
    {seq:"TCCAGGATCCTTAG",cut:5,task:"Now BamHI.",hint:"BamHI recognises GGATCC and cuts after the first G.",ok:"Correct: G^GATCC – the overhang is GATC."},
    {seq:"GCTAAGCTTCGAT",cut:4,task:"Finally, HindIII.",hint:"HindIII recognises AAGCTT and cuts after the first A.",ok:"Correct: A^AGCTT – the overhang is AGCT."}]}
},
{ id:"pcr", title:"PCR – Copying DNA", minutes:14,
  short:"How a few DNA molecules become billions of copies in two hours.",
  goals:["Name the components of a PCR","Describe the three steps of a cycle with their temperatures","Calculate exponential growth"],
  sections:[
  {h:"The idea",html:`
    <p>The <strong>polymerase chain reaction</strong> (PCR) copies a specific stretch of DNA in a test tube. Kary Mullis developed it in 1983 and received the Nobel Prize in Chemistry for it in 1993.</p>
    <p>Today PCR is used in every lab: for cloning, paternity tests, forensics and diagnosing infections.</p>`},
  {h:"What goes into the tube",html:`
    <ul>
      <li><strong>Template DNA</strong> containing the target region,</li>
      <li>two <strong>primers</strong> (forward and reverse, usually 18–25 nucleotides long) that flank the region on either side,</li>
      <li>a heat-stable <strong>Taq polymerase</strong> from Thermus aquaticus, a bacterium from hot springs,</li>
      <li>the four building blocks, the <strong>dNTPs</strong> (dATP, dTTP, dGTP, dCTP),</li>
      <li>a <strong>buffer</strong> containing magnesium ions, which the polymerase needs.</li>
    </ul>`},
  {h:"One cycle, three steps",html:`
    <div class="steps">
      <div class="step s1"><b>94–98 °C</b><strong>1 · Denaturation</strong><span>The hydrogen bonds break and the double strand separates.</span></div>
      <div class="step s2"><b>50–65 °C</b><strong>2 · Annealing</strong><span>The primers attach to their complementary sites.</span></div>
      <div class="step s3"><b>72 °C</b><strong>3 · Extension</strong><span>Taq polymerase extends the primers, about 1,000 bases per minute.</span></div>
    </div>
    <p>A <strong>thermocycler</strong> repeats these steps automatically 25 to 35 times. The annealing temperature depends on the primers: the more GC-rich they are, the higher it can be.</p>`},
  {h:"Exponential growth",html:`
    <p>Each cycle doubles the number of target molecules. After <em>n</em> cycles, one molecule becomes 2<sup>n</sup> copies. Move the slider:</p>
    <div data-widget="pcr"></div>`},
  {h:"Variants",html:`
    <ul>
      <li><strong>RT-PCR:</strong> a reverse transcriptase first writes RNA into DNA. This makes it possible to detect RNA viruses.</li>
      <li><strong>qPCR</strong> (real-time PCR): a fluorescence signal shows how much DNA has been made in each cycle, which lets you calculate the starting amount. This is how COVID-19 PCR tests worked.</li>
      <li><strong>Colony PCR:</strong> checks directly from a bacterial colony whether a plasmid carries the correct insert.</li>
    </ul>`}
  ],
  merke:"Denature (≈ 95 °C), anneal (≈ 55 °C), extend (72 °C). Each cycle doubles the target DNA.",
  game:{type:"match",title:"PCR memory",intro:"Match each term to the right description.",pairs:[
    ["Denaturation","At about 95 °C the DNA double strand separates"],
    ["Annealing","At about 55 °C the primers bind to the single strands"],
    ["Extension","At 72 °C the polymerase builds the new strand"],
    ["Taq polymerase","Heat-stable enzyme from a hot-spring bacterium"],
    ["Primers","Short DNA pieces that mark the start and end of the region"],
    ["dNTPs","The four nucleotide building blocks for the new strands"],
    ["Thermocycler","Machine that runs the temperature cycles automatically"]]}
},
{ id:"analysis", title:"Gel Electrophoresis & Sequencing", minutes:14,
  short:"How DNA is separated by size, made visible and read base by base.",
  goals:["Read an agarose gel and estimate fragment sizes","Explain the principle of Sanger sequencing","Place modern sequencing methods in context"],
  sections:[
  {h:"Gel electrophoresis",html:`
    <p><strong>Gel electrophoresis</strong> separates DNA fragments by size:</p>
    <ul>
      <li>The DNA is pipetted into the wells of an <strong>agarose gel</strong>, typically 1% agarose.</li>
      <li>Its phosphate groups make DNA <strong>negatively charged</strong>, so in an electric field it moves towards the <strong>positive pole</strong> (anode).</li>
      <li>The gel works like a sieve: <strong>small fragments travel faster and further</strong> than large ones.</li>
      <li>A fluorescent dye makes the bands visible under UV or blue light.</li>
    </ul>`},
  {h:"How to read a gel",html:`
    <figure class="diagram" style="max-width:420px">
      <div data-widget="gel"></div>
      <figcaption>Lane M is a size marker with known fragment lengths. The band in lane C sits at 250 bp.</figcaption>
    </figure>
    <p>A <strong>size marker</strong> (DNA ladder) is always run next to the samples. By comparing the height of a sample band with the marker bands, you can estimate the size of the fragment.</p>`},
  {h:"Sanger sequencing",html:`
    <p>In 1977, Frederick Sanger developed the <strong>chain-termination method</strong>:</p>
    <ul>
      <li>Besides the normal dNTPs, the reaction contains a small amount of <strong>ddNTPs</strong> (dideoxynucleotides). They lack the 3′-OH group.</li>
      <li>When a ddNTP is incorporated, no further nucleotide can be added – the chain stops.</li>
      <li>This produces fragments of every length. Each type of ddNTP glows in its own colour.</li>
      <li>Capillary electrophoresis sorts the fragments by length, and a laser reads the colours one after another – that is the sequence.</li>
    </ul>
    <p>Sanger sequencing reads up to about 1,000 bases and is still the standard method for checking plasmids.</p>`},
  {h:"Next-generation sequencing",html:`
    <ul>
      <li><strong>Illumina:</strong> millions of short DNA fragments are read in parallel.</li>
      <li><strong>Nanopore:</strong> a DNA strand is pulled through a tiny pore. Changes in the electric current reveal the bases – in real time and often over tens of thousands of bases in one go.</li>
    </ul>
    <p>The Human Genome Project took 13 years and about 3 billion US dollars. Today a human genome can be sequenced for less than 1,000 US dollars.</p>`}
  ],
  merke:"In a gel, DNA moves towards the positive pole – small fragments travel furthest. In Sanger sequencing, ddNTPs stop the chain.",
  game:{type:"mc",title:"Gel and sequencing quiz",intro:"Five questions, including a gel to analyse.",q:[
    {t:"In which direction does DNA move in an electric field?",o:["To the negative pole (cathode)","To the positive pole (anode)","It stays in the well","It depends on the base"],a:1,e:"The phosphate groups in the backbone make DNA negatively charged, so it moves towards the positive pole."},
    {t:"Roughly how large is the DNA fragment in lane A?",fig:"GEL",o:["≈ 250 bp","≈ 500 bp","≈ 1,000 bp","≈ 3,000 bp"],a:2,e:"The band in lane A is level with the 1,000 bp band of size marker M."},
    {t:"One fragment is 200 bp long, another 2,000 bp. Which one travels further?",o:["The 200 bp fragment","The 2,000 bp fragment","Both travel equally far","It depends only on the dye"],a:0,e:"Small fragments pass through the agarose mesh more easily and therefore travel further."},
    {t:"Why does synthesis stop when a ddNTP is incorporated?",o:["It lacks the 3′-OH group needed for the next bond","It is too large for the polymerase","It carries no base","It destroys the primer"],a:0,e:"Without a 3′-OH group no further nucleotide can be attached – the chain ends exactly at this base."},
    {t:"Which method delivers very long reads in real time?",o:["Sanger sequencing","Illumina","Nanopore sequencing","Gel electrophoresis"],a:2,e:"In nanopore sequencing, a single strand is pulled through a pore and read directly as it passes."}]}
},
{ id:"crispr", title:"CRISPR/Cas9", minutes:18,
  short:"The gene scissors: how a bacterial immune system became the most precise tool in genetic engineering.",
  goals:["Explain the roles of Cas9, guide RNA and PAM","Determine where Cas9 cuts","Distinguish knockout and knock-in"],
  sections:[
  {h:"A bacterial immune system",html:`
    <p><strong>CRISPR</strong> stands for Clustered Regularly Interspaced Short Palindromic Repeats. In this region of their DNA, bacteria store short pieces of viruses that have attacked them before – a kind of genetic memory.</p>
    <p>If the virus attacks again, the bacterium transcribes the stored pieces into RNA. This RNA guides <strong>Cas proteins</strong> to the matching viral DNA, which is then cut.</p>`},
  {h:"The gene scissors",html:`
    <p>In 2012, <strong>Emmanuelle Charpentier</strong> and <strong>Jennifer Doudna</strong> showed that this system can be programmed to target any DNA sequence. They received the Nobel Prize in Chemistry for this in 2020.</p>
    <dl class="terms">
      <div><dt>Cas9</dt><dd>The enzyme that cuts through both DNA strands.</dd></div>
      <div><dt>Guide RNA</dt><dd>An RNA with about 20 nucleotides that are complementary to the target site. It determines where Cas9 cuts.</dd></div>
      <div><dt>PAM</dt><dd>A short sequence directly after the target site. Cas9 from Streptococcus pyogenes needs <span class="mono">5′-NGG-3′</span>, where N can be any base. Without a PAM, Cas9 does not cut.</dd></div>
    </dl>
    <p>Cas9 cuts <strong>3 base pairs before the PAM</strong>, creating a blunt double-strand break:</p>
    <div class="seqdemo">5′-…<span class="proto">AGCTTGCATCGGACTTA<span class="scis">✂</span>GCA</span><span class="pamhl">CGG</span>…-3′</div>
    <div class="legend"><span><i></i>Target sequence (20 nt)</span><span><i style="background:var(--c4)"></i>PAM</span><span><b class="scis">✂</b> Cut site</span></div>`},
  {h:"Repair decides the outcome",html:`
    <p>The cell repairs the double-strand break itself. Which pathway it uses determines the result:</p>
    <ul>
      <li><strong>NHEJ</strong> (non-homologous end joining): fast but imprecise. Small insertions or deletions often arise that shift the reading frame – the gene is switched off (<strong>knockout</strong>).</li>
      <li><strong>HDR</strong> (homology-directed repair): if a repair template is supplied, it is incorporated exactly. This allows genes to be corrected or new sequences to be inserted (<strong>knock-in</strong>).</li>
    </ul>`},
  {h:"Applications",html:`
    <ul>
      <li><strong>Medicine:</strong> at the end of 2023, Casgevy became the first approved CRISPR therapy – for sickle cell disease and β-thalassaemia.</li>
      <li><strong>Base editing and prime editing</strong> change individual bases without cutting both strands.</li>
      <li><strong>dCas9:</strong> a Cas9 without cutting activity can switch genes on or off in a targeted way (CRISPRa/CRISPRi).</li>
      <li><strong>Diagnostics:</strong> related enzymes such as Cas12 and Cas13 detect viral genetic material quickly.</li>
    </ul>`},
  {h:"Ethical questions",html:`
    <p>In 2018, the researcher He Jiankui announced the birth of the first children with edited genomes – which was strongly condemned worldwide. Changes to the germline are passed on to future generations.</p>
    <p>Other open questions include unintended cuts at similar sites (off-target effects), fair access to expensive therapies and <strong>gene drives</strong>, which could alter entire wild populations.</p>`}
  ],
  merke:"The guide RNA finds the site, Cas9 cuts – 3 base pairs before the PAM sequence NGG.",
  game:{type:"cut",title:"Where does Cas9 cut?",intro:"Two target sequences. Tap the gap where Cas9 makes the double-strand break.",rounds:[
    {seq:"ATGACGTTACCGGATCAAGCTATGGCA",cut:19,marks:[{from:2,to:22,cls:"proto"},{from:22,to:25,cls:"pam"}],legend:true,task:"The target sequence and PAM are highlighted. Where does Cas9 cut?",hint:"Cas9 cuts 3 base pairs before (upstream of) the PAM.",ok:"Exactly! A blunt double-strand break forms three bases before the PAM."},
    {seq:"GTCCTTGACCAGTAGGCTAACGTCAGGTA",cut:21,marks:[{from:4,to:24,cls:"proto"}],legend:true,task:"This time only the target sequence is highlighted. Find the PAM first – then the cut site.",hint:"The PAM is NGG and follows directly after the 3′ end of the target sequence. Here it is AGG.",ok:"Perfect: the PAM is AGG, and Cas9 cuts three bases before it."}]}
},
{ id:"synbio", title:"Synthetic Biology & iGEM", minutes:14,
  short:"Biology as engineering: standard parts, genetic circuits and responsibility.",
  goals:["Describe the design-build-test-learn cycle","Assemble an expression cassette from standard parts","Understand biosafety and human practices"],
  sections:[
  {h:"Biology as engineering",html:`
    <p><strong>Synthetic biology</strong> applies engineering principles to living systems: you design biological functions, build them from standardised parts and test them.</p>
    <ol>
      <li><strong>Design:</strong> plan a genetic construct on the computer.</li>
      <li><strong>Build:</strong> synthesise or clone the DNA.</li>
      <li><strong>Test:</strong> measure whether the system works as planned.</li>
      <li><strong>Learn:</strong> learn from the data and improve the design.</li>
    </ol>`},
  {h:"Standard parts: BioBricks",html:`
    <p>iGEM collects genetic parts in the <strong>Registry of Standard Biological Parts</strong> – now more than 20,000 of them. Almost every construct designed to make a protein follows the same basic architecture:</p>
    <figure class="diagram">
      <svg viewBox="0 0 520 120" role="img" aria-label="Expression cassette: promoter, RBS, CDS, terminator">
        <path class="sv-par" d="M10 72 H510"/>
        <path d="M44 72 V40 H86" style="fill:none;stroke:var(--c5);stroke-width:4;stroke-linecap:round;stroke-linejoin:round"/><polygon points="98,40 84,32 84,48" style="fill:var(--c5)"/>
        <path d="M118 72 A18 18 0 0 1 154 72 Z" style="fill:var(--c4)"/>
        <path d="M180 56 H350 L372 72 L350 88 H180 Z" style="fill:var(--c1)"/>
        <text class="sv-w" x="272" y="76" text-anchor="middle" style="font-size:13px">GFP</text>
        <path d="M430 72 V40 M412 40 H448" style="fill:none;stroke:var(--c3);stroke-width:4;stroke-linecap:round"/>
        <text class="sv-t strong" x="64" y="108" text-anchor="middle">Promoter</text>
        <text class="sv-t strong" x="136" y="108" text-anchor="middle">RBS</text>
        <text class="sv-t strong" x="272" y="108" text-anchor="middle">CDS</text>
        <text class="sv-t strong" x="430" y="108" text-anchor="middle">Terminator</text>
      </svg>
      <figcaption>The symbols follow the SBOL standard that teams use to draw their constructs.</figcaption>
    </figure>
    <dl class="terms">
      <div><dt>Promoter</dt><dd>Where RNA polymerase starts. It determines when and how strongly the gene is transcribed.</dd></div>
      <div><dt>RBS</dt><dd>The ribosome binding site on the mRNA. Its strength controls how much protein is made.</dd></div>
      <div><dt>CDS</dt><dd>The coding sequence – from the start codon ATG to the stop codon.</dd></div>
      <div><dt>Terminator</dt><dd>Ends transcription so that neighbouring parts are not transcribed as well.</dd></div>
    </dl>`},
  {h:"Genetic circuits",html:`
    <p>These parts can be combined into circuits, much like in electronics. Two famous examples date from 2000:</p>
    <ul>
      <li>The <strong>toggle switch</strong> by Gardner and Collins: two genes that repress each other. The cell stays in one of two stable states – like a light switch.</li>
      <li>The <strong>repressilator</strong> by Elowitz and Leibler: three repressors in a loop that make the cell glow rhythmically – a biological clock.</li>
    </ul>
    <p><strong>Reporter genes</strong> such as GFP from the jellyfish Aequorea victoria act as measuring instruments: they show when a promoter is active.</p>`},
  {h:"Safety & responsibility",html:`
    <ul>
      <li><strong>Biosafety:</strong> labs are classified into biosafety levels by risk (BSL-1 to BSL-4). School labs and most iGEM projects work with harmless organisms at the lowest level.</li>
      <li><strong>Built-in safety:</strong> kill switches or strains that cannot survive without a specific nutrient prevent them from spreading outside the lab.</li>
      <li><strong>Human practices:</strong> iGEM teams talk to experts, affected people and the public to make sure their project is responsible and genuinely useful.</li>
    </ul>`}
  ],
  merke:"Promoter – RBS – CDS – terminator: the basic architecture of almost every construct designed to make a protein.",
  game:{type:"order",title:"Build a GFP construct",intro:"Drag the parts into the order in which they appear on the DNA, from 5′ to 3′.",items:[
    "Promoter – where RNA polymerase binds",
    "RBS – the ribosome binding site",
    "Start codon ATG",
    "CDS – the gene for green fluorescent protein (GFP)",
    "Stop codon",
    "Terminator – where transcription ends"]}
}
];
/* ===================================================================== */

const TONES=["var(--c1)","var(--c2)","var(--c3)","var(--c4)","var(--c5)","var(--c6)"];
MODULES.forEach((m,i)=>{m.idx=i;m.num=i+1;m.tone=TONES[i%TONES.length]});
const N=MODULES.length, PASS=0.8;
const LABEL={match:"Matching",complement:"Base-pair puzzle",mc:"Quiz",order:"Put in order",cloze:"Fill in the blanks",codon:"Crack the code",sort:"Classify",cut:"Find the cut site"};
const ALWAYS_PASS={match:1,order:1,cut:1};

/* ---------- State ---------- */
const $=(s,r=document)=>r.querySelector(s);
const KEY="mb-progress-en-v1";
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.passed)return v}catch(e){}return{passed:{},unlockAll:false}}
let P=load();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}};
const isPassed=m=>!!(m&&P.passed[m.id]);
const isUnlocked=m=>P.unlockAll||m.idx===0||isPassed(m)||isPassed(MODULES[m.idx-1]);
const status=m=>isPassed(m)?"done":isUnlocked(m)?"open":"locked";
const doneCount=()=>MODULES.filter(isPassed).length;
const nextModule=()=>MODULES.find(m=>isUnlocked(m)&&!isPassed(m))||null;
const pct=x=>Math.round(x*100)+"%";
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const badgeInner=(m,s)=>s==="done"?ICON.check:s==="locked"?ICON.lock:m.num;
const plural=(n,one,many)=>n===1?one:many;

/* ---------- Sidebar ---------- */
function renderNav(cur){
  let h=`<button class="home-link" data-go="home" ${!cur?'aria-current="page"':''}>${ICON.home}Overview</button><span class="label nav-label">Learning path</span>`;
  MODULES.forEach(m=>{const s=status(m),act=cur===m;
    h+=`<div style="--tone:${m.tone}"><button class="mrow ${s}" data-go="${m.id}" ${act?'aria-current="page"':''} aria-label="Module ${m.num}: ${m.title}${s==="locked"?" (locked)":s==="done"?" (completed)":""}"><span class="badge">${badgeInner(m,s)}</span><span class="mname">${m.title}</span></button>`;
    if(act&&s!=="locked")h+=`<div class="subnav">${m.sections.map((x,i)=>`<button data-sec="s-${m.id}-${i}">${x.h}</button>`).join("")}<button class="sub-game" data-sec="s-${m.id}-game">${ICON.game}Knowledge check</button></div>`;
    h+=`</div>`});
  $("#nav").innerHTML=h;
  const d=doneCount();
  $("#spText").textContent=`${d} of ${N} modules completed`;
  $("#spPct").textContent=pct(d/N);
  $("#spBar").style.width=(d/N*100)+"%";
  $("#topProg").textContent=`${d}/${N}`;
  $("#unlockBtn").setAttribute("aria-pressed",P.unlockAll);
  renderReset(false);
}
function renderReset(ask){
  $("#resetWrap").innerHTML=ask
    ?`<div class="confirm">Delete all progress? <button class="danger" id="resetYes">Yes, delete</button><button id="resetNo">Cancel</button></div>`
    :`<button class="tool" id="resetBtn">${ICON.redo} Reset progress</button>`;
}

/* ---------- Dashboard ---------- */
function ringSVG(p){
  const r=92,c=2*Math.PI*r;
  return `<svg viewBox="0 0 220 220" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--c1)"/><stop offset=".5" style="stop-color:var(--c2)"/><stop offset="1" style="stop-color:var(--c3)"/></linearGradient></defs>
  <circle cx="110" cy="110" r="${r}" fill="none" style="stroke:var(--hair)" stroke-width="14"/>
  <circle cx="110" cy="110" r="${r}" fill="none" stroke="url(#rg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" transform="rotate(-90 110 110)" style="transition:stroke-dashoffset 1s"/></svg>`;
}
function renderHome(){
  const d=doneCount(), nx=nextModule(), all=d===N;
  const scores=MODULES.filter(isPassed).map(m=>P.passed[m.id].score);
  const avg=scores.length?scores.reduce((a,b)=>a+b,0)/scores.length:null;
  const mins=MODULES.reduce((a,m)=>a+m.minutes,0);
  const cta=all?{id:MODULES[0].id,t:"Review the course"}:d===0&&nx===MODULES[0]?{id:MODULES[0].id,t:"Start with module 1"}:{id:(nx||MODULES[0]).id,t:`Continue with module ${(nx||MODULES[0]).num}`};
  $("#view").innerHTML=`<div class="view" style="display:flex;flex-direction:column;gap:22px">
  <section class="hero glass">
    <div>
      <span class="label">iGEM 2026 · Learning platform</span>
      <h1>Molecular biology, <em>step by step</em></h1>
      <p class="lead">${N} modules that build on each other take you from the DNA double helix to CRISPR/Cas9. Each module ends with a mini-game – pass it to unlock the next module. Completed modules stay open for review at any time.</p>
      <div class="cta">
        <button class="btn dark" data-go="${cta.id}">${cta.t} ${ICON.arrow}</button>
        <button class="btn" data-scroll="path">View learning path</button>
      </div>
    </div>
    <div class="ring-wrap">${ringSVG(d/N)}<div class="ring-c"><b>${d}<small>/${N}</small></b><span>modules completed</span></div></div>
  </section>

  ${all?`<section class="finish glass"><span class="badge done">${ICON.trophy}</span><div><h3>Course complete!</h3><p>You have passed all ${N} modules. All content stays open for review and reference.</p></div></section>`:""}

  <section class="stats glass" aria-label="Your progress">
    <div class="stat"><b>Module ${d} of ${N}</b><span>completed</span><div class="track"><i style="width:${d/N*100}%"></i></div></div>
    <div class="stat"><b>${avg===null?"–":pct(avg)}</b><span>average score in the knowledge checks</span></div>
    <div class="stat"><b>≈ ${Math.round(mins/60)} h</b><span>learning time for the whole course (${mins} minutes)</span></div>
  </section>

  <div class="section-head" id="path">
    <h2>Your <em>learning path</em></h2>
    <p>The modules build on each other. A locked module opens as soon as you pass the previous one.</p>
  </div>
  <ol class="path">
    ${MODULES.map(m=>{const s=status(m),isNx=nx===m;return `<li class="path-row ${s} ${isNx?"next":""}" style="--tone:${m.tone}">
      <div class="node"><span class="badge">${badgeInner(m,s)}</span></div>
      <button class="path-card glass" data-go="${m.id}">
        <div><span class="pc-num">Module ${m.num}</span><h3>${m.title}</h3><p>${m.short}</p></div>
        <div class="pc-side"><span class="pill ${s}">${s==="done"?"Completed":s==="locked"?"Locked":isNx?"Up next":"Available"}</span>
        <span class="pc-meta">${m.minutes} min · ${LABEL[m.game.type]}${s==="done"?" · "+pct(P.passed[m.id].score):""}</span></div>
      </button></li>`}).join("")}
  </ol></div>`;
}

/* ---------- Locked page ---------- */
function renderLocked(m){
  const prev=MODULES[m.idx-1], nx=nextModule();
  $("#view").innerHTML=`<div class="view" style="--tone:${m.tone}"><section class="lockpage glass">
    <span class="badge locked">${ICON.lock}</span>
    <span class="label">Module ${m.num} of ${N}</span>
    <h1>${m.title}</h1>
    <p>This module is still locked. Pass the knowledge check in module ${prev.num}, “${prev.title}”, to unlock it.</p>
    <ul>${m.goals.map(g=>`<li>${g}</li>`).join("")}</ul>
    <button class="btn dark" data-go="${(nx||prev).id}">Continue with module ${(nx||prev).num} ${ICON.arrow}</button>
  </section></div>`;
}

/* ---------- Module page ---------- */
function renderModule(m){
  const g=m.game, passed=isPassed(m);
  $("#view").innerHTML=`<div class="view mod-page" style="--tone:${m.tone}">
    <header class="mod-head">
      <div class="crumbs"><button class="back" data-go="home">${ICON.back} Overview</button><span class="chap">Module ${m.num} of ${N}</span></div>
      <h1>${m.title}</h1>
      <p class="intro">${m.short}</p>
      <div class="meta"><span>${ICON.clock} ${m.minutes} minutes</span><span>${ICON.game} Mini-game: ${LABEL[g.type]}</span><span id="modStatus" class="${passed?"ok":""}">${passed?ICON.check+" Completed":"Not completed yet"}</span></div>
    </header>
    <section class="goals glass"><span class="label">What you’ll learn</span><ul>${m.goals.map(x=>`<li>${x}</li>`).join("")}</ul></section>
    <article class="paper glass"><div class="prose">
      ${m.sections.map((s,i)=>`<section class="sec" id="s-${m.id}-${i}"><h2 data-n="${String(i+1).padStart(2,"0")}">${s.h}</h2>${s.html}</section>`).join("")}
      <aside class="merke"><span class="label">Key takeaway</span><p>${m.merke}</p></aside>
    </div></article>
    <section class="game glass" id="s-${m.id}-game">
      <div class="game-head"><span class="label">Knowledge check · ${LABEL[g.type]}</span><h2>${g.title}</h2><p>${g.intro}</p>
        <p class="already" id="already">${passed?`Already passed with ${pct(P.passed[m.id].score)}. You can practise again at any time.`:ALWAYS_PASS[g.type]?"You pass as soon as you have solved the task completely.":"You need at least 80% correct answers to pass."}</p></div>
      <div class="game-body" id="game"></div>
    </section>

      const up=ev=>{if(ev.pointerId!==id)return;cleanup();if(started)drag.end()};
      const tm=ev=>{if(started)ev.preventDefault()};
      if(touchHold)timer=setTimeout(begin,220);else if(e.pointerType!=="mouse")begin();
      addEventListener("pointermove",mv,{passive:false});addEventListener("pointerup",up);addEventListener("pointercancel",up);el.addEventListener("touchmove",tm,{passive:false});
    };
    el.oncontextmenu=e=>{if(e.target.closest(".order-item"))e.preventDefault()};
    el.onkeydown=e=>{const li=e.target.closest(".order-item");if(!li||solved)return;const p=+li.dataset.pos;
      const q=e.key==="ArrowUp"?p-1:e.key==="ArrowDown"?p+1:-1;if(q<0||q>=n)return;e.preventDefault();moveTo(p,q);items()[q]?.focus()};
    el.onclick=e=>{
      if(e.target.closest("[data-retry]"))return reset();
      if(e.target.closest("[data-check]")){tries++;marks=ord.map((v,i)=>v===i);draw()}
    };
    reset();
  },
  cloze(el,g,done){
    const parts=g.text.split(/\{\{(.+?)\}\}/), answers=parts.filter((_,i)=>i%2);
    const bank=[...new Set([...answers,...(g.extra||[])])].sort((a,b)=>a.localeCompare(b,"en"));
    let gi=0, fired=false;
    el.innerHTML=`<div class="cloze">${parts.map((p,i)=>{if(!(i%2))return p;const k=gi++;return `<select class="gap" id="gap-${k}" data-gap="${k}" aria-label="Blank ${k+1}"><option value="">…</option>${bank.map(w=>`<option>${w}</option>`).join("")}</select>`}).join("")}</div>
      <div class="game-foot"><span class="score-line" id="clozeInfo">Choose a word for each blank.</span><button class="btn dark small" data-check>Check answers</button></div><div id="clozeRes"></div>`;
    const sels=[...el.querySelectorAll(".gap")];
    el.onchange=e=>{if(e.target.matches(".gap"))e.target.classList.remove("right","wrong")};
    el.onclick=e=>{if(!e.target.closest("[data-check]"))return;
      let right=0;sels.forEach((s,i)=>{const ok=s.value===answers[i];if(ok)right++;s.classList.toggle("right",ok);s.classList.toggle("wrong",!ok)});
      const n=answers.length,sc=right/n,ok=sc>=PASS;
      $("#clozeInfo",el).textContent=`${right} of ${n} blanks correct`;
      $("#clozeRes",el).innerHTML=ok?result(true,"Passed!",`${right} of ${n} blanks correct.`):result(false,"Not quite yet",`${right} of ${n} correct. Change the blanks marked in red and check again.`);
      if(ok&&!fired){fired=true;done(sc)}};
  },
  complement(el,g,done){
    const top=g.strand.split(""), n=top.length, PR={A:"T",T:"A",G:"C",C:"G"};
    let val=Array(n).fill(""), cur=0, marks=null, passed=false;
    el.tabIndex=-1;
    function draw(){
      el.innerHTML=`<div class="strand-wrap"><div class="strand">
        <div class="strand-row"><span class="end">5′</span>${top.map(b=>`<span class="base b-${b}">${b}</span>`).join("")}<span class="end">3′</span></div>
        <div class="strand-row"><span class="end">3′</span>${val.map((v,i)=>`<button class="base slot ${v?"filled b-"+v:""} ${i===cur&&!passed?"cur":""} ${marks?(marks[i]?"right":"wrong"):""}" data-cell="${i}" aria-label="Position ${i+1}${v?": "+v:", empty"}" ${passed?"disabled":""}>${v}</button>`).join("")}<span class="end">5′</span></div>
      </div></div>
      ${passed?"":`<div class="keypad">${"ATGC".split("").map(b=>`<button class="key-b b-${b}" data-b="${b}" aria-label="Base ${b}">${b}</button>`).join("")}<button class="key-b back" data-back aria-label="Delete last base" title="Delete">${ICON.del}</button></div>`}
      <div class="game-foot"><span class="score-line">${marks?`${marks.filter(Boolean).length} of ${n} bases correct`:`${val.filter(Boolean).length} of ${n} bases placed`}</span>${passed?"":`<button class="btn dark small" data-check ${val.includes("")?"disabled":""}>Check strand</button>`}</div>
      <div id="compRes"></div>`;
    }
    function put(b){if(passed)return;val[cur]=b;marks=null;if(cur<n-1)cur++;draw()}
    function back(){if(passed)return;if(!val[cur]&&cur>0)cur--;val[cur]="";marks=null;draw()}
    el.onclick=e=>{
      const k=e.target.closest("[data-b]");if(k)return put(k.dataset.b);
      if(e.target.closest("[data-back]"))return back();
      const c=e.target.closest("[data-cell]");if(c){cur=+c.dataset.cell;draw();return}
      if(e.target.closest("[data-check]")){marks=val.map((v,i)=>v===PR[top[i]]);const r=marks.filter(Boolean).length,s=r/n,ok=s>=PASS;draw();
        $("#compRes",el).innerHTML=ok?result(true,"Passed!",r===n?"Every base is paired correctly.":`${r} of ${n} correct. Marked in red: the base doesn’t fit there.`):result(false,"Not quite yet",`${r} of ${n} correct. Remember: A pairs with T, G with C. Tap a red position to change it.`);
        if(ok){passed=true;const res=$("#compRes",el).innerHTML;draw();$("#compRes",el).innerHTML=res;done(s)}}
    };
    el.onkeydown=e=>{const k=e.key.toUpperCase();if("ATGC".includes(k)&&k.length===1){e.preventDefault();put(k)}else if(e.key==="Backspace"){e.preventDefault();back()}};
    draw();
  },
  sort(el,g,done){
    let sel=g.items.map(()=>null), marks=null, fired=false;
    function draw(){
      el.innerHTML=`<div class="sort">${g.items.map((it,i)=>`<div class="sort-item ${marks?(marks[i]?"right":"wrong"):""}"><p>${it[0]}</p><div class="chips" role="group" aria-label="Choose a category">${g.cats.map((c,k)=>`<button class="chip-b ${sel[i]===k?"on":""}" data-i="${i}" data-k="${k}" aria-pressed="${sel[i]===k}">${c}</button>`).join("")}</div></div>`).join("")}</div>
      <div class="game-foot"><span class="score-line">${marks?`${marks.filter(Boolean).length} of ${g.items.length} classified correctly`:`${sel.filter(x=>x!==null).length} of ${g.items.length} classified`}</span><button class="btn dark small" data-check ${sel.includes(null)?"disabled":""}>Check answers</button></div><div id="sortRes"></div>`;
    }
    el.onclick=e=>{
      const c=e.target.closest("[data-k]");if(c){sel[+c.dataset.i]=+c.dataset.k;marks=null;draw();return}
      if(e.target.closest("[data-check]")){marks=g.items.map((it,i)=>sel[i]===it[1]);const r=marks.filter(Boolean).length,n=g.items.length,s=r/n,ok=s>=PASS;draw();
        $("#sortRes",el).innerHTML=ok?result(true,"Passed!",`${r} of ${n} classified correctly.`):result(false,"Not quite yet",`${r} of ${n} correct. Tip: use the codon table from module 6 to check whether the amino acid changes.`);
        if(ok&&!fired){fired=true;done(s)}}
    };
    draw();
  },
  codon(el,g,done){
    const cods=g.mrna.split(" "), keys=Object.keys(AAN).filter(k=>k!=="*").sort((a,b)=>AAN[a][0].localeCompare(AAN[b][0])).concat("*");
    let fired=false;
    el.innerHTML=`<div class="codons">${cods.map((c,i)=>`<div class="codon" id="cod-${i}"><small>Codon ${i+1}</small><span class="cseq">${c.split("").map(b=>`<span class="b-${b}">${b}</span>`).join("")}</span><select id="codsel-${i}" data-c="${i}" aria-label="Amino acid for ${c}"><option value="">Amino acid …</option>${keys.map(k=>`<option value="${k}">${AAN[k][0]} – ${AAN[k][1]}</option>`).join("")}</select></div>`).join("")}</div>
      <details class="hint"><summary>Show codon table</summary>${codonTable()}</details>
      <div class="game-foot"><span class="score-line" id="codInfo">Read the mRNA from 5′ to 3′.</span><button class="btn dark small" data-check>Check translation</button></div><div id="codRes"></div>`;
    el.onchange=e=>{const s=e.target.closest("[data-c]");if(s)$("#cod-"+s.dataset.c,el).classList.remove("right","wrong")};
    el.onclick=e=>{if(!e.target.closest("[data-check]"))return;
      let r=0;cods.forEach((c,i)=>{const ok=$("#codsel-"+i,el).value===code(c);if(ok)r++;$("#cod-"+i,el).classList.toggle("right",ok);$("#cod-"+i,el).classList.toggle("wrong",!ok)});
      const n=cods.length,s=r/n,ok=s>=PASS;
      $("#codInfo",el).textContent=`${r} of ${n} codons translated correctly`;
      $("#codRes",el).innerHTML=ok?result(true,"Passed!",`Your peptide: ${cods.map(c=>AAN[code(c)][0]).join("–")}. The last codon ends translation.`):result(false,"Not quite yet",`${r} of ${n} correct. First base on the left, second at the top, third inside the cell.`);
      if(ok&&!fired){fired=true;done(s)}};
  },
  cut(el,g,done){
    let r,miss,wrong,solved,fired;
    const reset=()=>{r=0;miss=0;wrong=null;solved=false;fired=false;draw()};
    function draw(){
      const R=g.rounds[r], s=R.seq.split(""), last=r===g.rounds.length-1;
      const cls=i=>(R.marks||[]).filter(m=>i>=m.from&&i<m.to).map(m=>m.cls).join(" ");
      let sq=`<span class="end">5′</span>`;
      s.forEach((b,i)=>{if(i>0)sq+=solved&&i===R.cut?`<span class="cutmark" aria-label="Cut site">${ICON.scissors}</span>`:`<button class="gap-b ${wrong===i?"wrong":""}" data-gap="${i}" aria-label="Cut between base ${i} and ${i+1}" ${solved?"disabled":""}></button>`;sq+=`<span class="nt ${cls(i)}">${b}</span>`});
      sq+=`<span class="end">3′</span>`;
      let h=`<div class="round-head"><span class="label">Round ${r+1} of ${g.rounds.length}</span><p>${R.task}</p></div>
        <div class="seq-scroll"><div class="seq">${sq}</div></div>
        ${R.legend?`<div class="legend"><span><i></i>Target sequence (20 nt)</span>${(R.marks||[]).some(m=>m.cls==="pam")?`<span><i style="background:var(--c4)"></i>PAM</span>`:""}</div>`:""}
        ${solved?"":`<details class="hint"><summary>Show hint</summary><p>${R.hint}</p></details>`}
        <div class="game-foot"><span class="score-line ${solved?"ok":wrong!==null?"no":""}">${solved?R.ok:wrong!==null?"It doesn’t cut here. Try another spot.":"Tap the gap between two bases."}</span>${solved&&!last?`<button class="btn dark small" data-next>Next round ${ICON.arrow}</button>`:""}</div>`;
      if(solved&&last){const sc=g.rounds.length/(g.rounds.length+miss);h+=result(true,"All cut sites found!",miss?`With ${miss} ${plural(miss,"miss","misses")} – score ${pct(sc)}.`:"Without a single miss.","Play again");if(!fired){fired=true;setTimeout(()=>done(sc))}}
      el.innerHTML=h;
    }
    el.onclick=e=>{
      if(e.target.closest("[data-retry]"))return reset();
      if(e.target.closest("[data-next]")){r++;solved=false;wrong=null;draw();return}
      const gp=e.target.closest("[data-gap]");if(!gp||solved)return;
      const i=+gp.dataset.gap;if(i===g.rounds[r].cut){solved=true;wrong=null}else{miss++;wrong=i}draw();
    };
    reset();
  }
};

/* ---------- Routing & events ---------- */
function route(){
  const id=location.hash.slice(1), m=MODULES.find(x=>x.id===id);
  renderNav(m||null);
  if(m)isUnlocked(m)?renderModule(m):renderLocked(m);else renderHome();
  $("#topTitle").textContent=m?`${m.num} · ${m.title}`:"Overview";
  document.body.classList.remove("menu");
}
function go(id){
  if(id==="home"){if(location.hash)history.pushState(null,"",location.pathname+location.search);route()}
  else if(location.hash!=="#"+id)location.hash=id;else route();
  window.scrollTo({top:0,behavior:"smooth"});
}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-go]");if(g&&!g.disabled){go(g.dataset.go);return}
  const sc=e.target.closest("[data-sec]");if(sc){document.body.classList.remove("menu");document.getElementById(sc.dataset.sec)?.scrollIntoView({behavior:"smooth",block:"start"});return}
  const s=e.target.closest("[data-scroll]");if(s){document.getElementById(s.dataset.scroll)?.scrollIntoView({behavior:"smooth",block:"start"});return}
  if(e.target.closest("#resetBtn"))return renderReset(true);
  if(e.target.closest("#resetNo"))return renderReset(false);
  if(e.target.closest("#resetYes")){P={passed:{},unlockAll:false};persist();go("home");return}
  if(e.target.closest("#unlockBtn")){P.unlockAll=!P.unlockAll;persist();route()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.body.classList.remove("menu")});
window.addEventListener("hashchange",route);
window.addEventListener("popstate",route);
$("#menuBtn").innerHTML=ICON.menu;
$("#themeBtn").innerHTML=ICON.moon;
$("#menuBtn").addEventListener("click",()=>document.body.classList.add("menu"));
$("#scrim").addEventListener("click",()=>document.body.classList.remove("menu"));
$("#wikiLink").href="#";
try{const t=localStorage.getItem("lp-theme");if(t)document.documentElement.dataset.theme=JSON.parse(t)}catch(e){}
$("#themeBtn").addEventListener("click",()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme=dark?"light":"dark";try{localStorage.setItem("lp-theme",JSON.stringify(r.dataset.theme))}catch(e){}
});
route();
</script>
